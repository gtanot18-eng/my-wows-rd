name: Titan Fast-Boot Ultra Enterprise Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password (Default: half)'
        required: true
        default: 'half'
      enable_background_suite:
        description: 'Deploy Desktop Suite & Tools in Background (Zero Boot Delay)'
        type: boolean
        default: true
      enable_kernel_tweaks:
        description: 'Enable 60 FPS, TCP NoDelay & Low Latency Kernel Tuning'
        type: boolean
        default: true

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. الإقلاع الفوري: فك شروط الأمان، تهيئة الحساب، وتوافق Windows 7 (أقل من 5 ثوانٍ)
      # =========================================================================
      - name: Stage 1 - Fast-Boot Security & User Provisioning
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 إلغاء شروط التعقيد لقبول كلمة المرور القصيرة (half)
          $secCfg = Join-Path $env:TEMP "secpol.cfg"
          $secSdb = Join-Path $env:TEMP "secpol.sdb"
          secedit /export /cfg $secCfg /quiet
          if (Test-Path $secCfg) {
              $content = Get-Content $secCfg
              $content = $content -replace "PasswordComplexity = 1", "PasswordComplexity = 0"
              $content = $content -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0"
              $content = $content -replace "PasswordHistorySize = \d+", "PasswordHistorySize = 0"
              $content = $content -replace "MinimumPasswordAge = \d+", "MinimumPasswordAge = 0"
              Set-Content -Path $secCfg -Value $content
              secedit /configure /db $secSdb /cfg $secCfg /areas SECURITYPOLICY /quiet
              Remove-Item $secCfg, $secSdb -Force -ErrorAction SilentlyContinue
          }

          # 1.2 تعيين كلمة المرور للمستخدم runneradmin
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.3 تفعيل RDP وإلغاء NLA وتخفيض التشفير (Windows 7 Native Compatibility)
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.4 تفعيل حزم TLS 1.0/1.1/1.2 لضمان اتصال عملاء Windows 7 القدامى
          $Ciphers = @('TLS 1.0', 'TLS 1.1', 'TLS 1.2', 'SSL 3.0')
          foreach ($c in $Ciphers) {
              $srv = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$c\Server"
              $cli = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$c\Client"
              New-Item -Path $srv -Force | Out-Null
              New-Item -Path $cli -Force | Out-Null
              Set-ItemProperty -Path $srv -Name 'Enabled' -Value 1 -Force
              Set-ItemProperty -Path $srv -Name 'DisabledByDefault' -Value 0 -Force
              Set-ItemProperty -Path $cli -Name 'Enabled' -Value 1 -Force
              Set-ItemProperty -Path $cli -Name 'DisabledByDefault' -Value 0 -Force
          }

          # 1.5 فتح المنافذ وإعادة تشغيل خدمة RDP
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. تحسينات الأداء، الرسوميات 60 FPS، وإلغاء القيود (لحظية في جزء من الثانية)
      # =========================================================================
      - name: Stage 2 - 60 FPS DWM & Ultra-Low Latency Kernel Tweaks
        if: ${{ github.event.inputs.enable_kernel_tweaks == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # 2.1 ضبط معدل الإطارات إلى 60 FPS وسرعة استجابة الشاشة (15ms Interval)
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2 -Force

          # 2.2 تحسين شبكة TCP وإلغاء خوارزمية Nagle (TCP NoDelay & Zero Jitter)
          $Tcp = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
          Set-ItemProperty -Path $Tcp -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $Tcp -Name 'TCPNoDelay' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $Tcp -Name 'DefaultTTL' -Value 64 -Type DWord -Force

          # 2.3 تحرير النطاق الترددي للشبكة وإلغاء اختناق وسائط النظام
          $SysProfile = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
          Set-ItemProperty -Path $SysProfile -Name 'NetworkThrottlingIndex' -Value 0xFFFFFFFF -Type DWord -Force
          Set-ItemProperty -Path $SysProfile -Name 'SystemResponsiveness' -Value 0 -Type DWord -Force

          # 2.4 إيقاف Windows Defender والـ Telemetry لتحرير 100% من المعالج والذاكرة
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableScriptScanning $true

          $Services = @('DiagTrack', 'dmwappushservice', 'WerSvc', 'SysMain')
          foreach ($s in $Services) {
              Stop-Service -Name $s -Force
              Set-Service -Name $s -StartupType Disabled
          }

          # 2.5 تفعيل الوضع الليلي وتوجيه الصوت الافتراضي
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'HideFileExt' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'Hidden' -Value 1 -Force

          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv

      # =========================================================================
      # 3. توليد حزمة أدوات سطح المكتب المتقدمة (Desktop Power Suite)
      # =========================================================================
      - name: Stage 3 - Desktop Utilities Depot Deployment
        if: ${{ github.event.inputs.enable_background_suite == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $Desktop = 'C:\Users\runneradmin\Desktop'
          if (!(Test-Path $Desktop)) { New-Item -Path $Desktop -ItemType Directory -Force | Out-Null }

          # 3.1 أداة تنظيف وتحرير الذاكرة الفورية (Memory Purger)
          $RamCleaner = @'
          Write-Host "==========================================" -ForegroundColor Magenta
          Write-Host "       TITAN RAM & CACHE FLUSHER 2026     " -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Magenta
          Write-Host "[*] Purging System Standby Cache..." -ForegroundColor Cyan
          Clear-DnsClientCache
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          [System.GC]::WaitForPendingFinalizers()
          Write-Host "[✓] System RAM and Cache Optimized!" -ForegroundColor Green
          Start-Sleep -Seconds 2
          '@
          [System.IO.File]::WriteAllText((Join-Path $Desktop 'Clean_Memory.ps1'), $RamCleaner, [System.Text.Encoding]::UTF8)

          # 3.2 أداة قياس سرعة الإنترنت المباشرة (Cloudflare Multi-Stream Benchmark)
          $SpeedBenchmark = @'
          Write-Host "==========================================" -ForegroundColor Yellow
          Write-Host "       NETWORK THROUGHPUT BENCHMARK       " -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Yellow
          Write-Host "[*] Measuring Download Bandwidth via Global Edge CDN..." -ForegroundColor Cyan
          $url = "https://speed.cloudflare.com/__down?bytes=50000000"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          (New-Object System.Net.WebClient).DownloadData($url) | Out-Null
          $sw.Stop()
          $mbps = [math]::Round((50 / $sw.Elapsed.TotalSeconds) * 8, 2)
          Write-Host "[✓] Bandwidth Measured: $mbps Mbps" -ForegroundColor Green
          Write-Host "Press any key to close..."
          $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          '@
          [System.IO.File]::WriteAllText((Join-Path $Desktop 'Speed_Test.ps1'), $SpeedBenchmark, [System.Text.Encoding]::UTF8)

          # 3.3 بطاقة معلومات العتاد ولوحة التحكم (Hardware Telemetry)
          $HardwareCard = @'
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "       SYSTEM HARDWARE TELEMETRY          " -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture, TotalPhysicalMemory
          Write-Host ""
          Get-WmiObject Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          Write-Host "Press any key to close..."
          $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          '@
          [System.IO.File]::WriteAllText((Join-Path $Desktop 'System_Info.ps1'), $HardwareCard, [System.Text.Encoding]::UTF8)

          # 3.4 سكريبت تثبيت سريع لحزمة المتصفحات (Brave, Chrome, Firefox) بضغطة زر
          $InstallBrowsers = @'
          Write-Host "[*] Installing Brave, Chrome, and Firefox in Background..." -ForegroundColor Cyan
          winget install --id Brave.Brave --silent --accept-source-agreements --accept-package-agreements
          winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements
          winget install --id Mozilla.Firefox --silent --accept-source-agreements --accept-package-agreements
          Write-Host "[✓] Browsers Installed Successfully!" -ForegroundColor Green
          Start-Sleep -Seconds 3
          '@
          [System.IO.File]::WriteAllText((Join-Path $Desktop 'Install_Browsers.ps1'), $InstallBrowsers, [System.Text.Encoding]::UTF8)

          # 3.5 سكريبت تثبيت أدوات المطورين والتحميل السريع (VSCode, Git, Python, yt-dlp, 7zip)
          $InstallDevTools = @'
          Write-Host "[*] Installing Developer & Media Tools..." -ForegroundColor Cyan
          winget install --id Microsoft.VisualStudioCode --silent --accept-source-agreements --accept-package-agreements
          winget install --id Git.Git --silent --accept-source-agreements --accept-package-agreements
          winget install --id 7zip.7zip --silent --accept-source-agreements --accept-package-agreements
          winget install --id yt-dlp.yt-dlp --silent --accept-source-agreements --accept-package-agreements
          Write-Host "[✓] Tools Installed Successfully!" -ForegroundColor Green
          Start-Sleep -Seconds 3
          '@
          [System.IO.File]::WriteAllText((Join-Path $Desktop 'Install_DevTools.ps1'), $InstallDevTools, [System.Text.Encoding]::UTF8)

      # =========================================================================
      # 4. محرك الأنفاق فائق السرعة والمراقبة الذكية (إطلاق فوري في أقل من 10 ثوانٍ)
      # =========================================================================
      - name: Stage 4 - Launch Instant Multi-Tunnel Engine & Live Session Watchdog
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import urllib.request
          import zipfile

          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          password = "${{ github.event.inputs.rdp_password }}" or "half"
          rdp_address = None

          print("[*] Launching Primary High-Speed TCP Engine (Pinggy Direct Stream)...")
          ssh_cmd = [
              "ssh",
              "-T",
              "-p", "443",
              "-R", "0:localhost:3389",
              "-o", "StrictHostKeyChecking=no",
              "-o", "ServerAliveInterval=10",
              "-o", "ServerAliveCountMax=120",
              "-o", "TCPKeepAlive=yes",
              "tcp@a.pinggy.io"
          ]

          proc = subprocess.Popen(
              ssh_cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
              encoding='utf-8',
              errors='replace'
          )

          start_t = time.time()
          while time.time() - start_t < 18:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean = line.strip()
              match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean)
              if match:
                  rdp_address = match.group(1)
                  break

          # نفق الطوارئ الاحتياطي الفوري في حال تأخر النفق الأساسي
          if not rdp_address:
              print("[!] Primary engine busy. Engaging Bore High-Speed Failover...")
              try:
                  url = "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip"
                  urllib.request.urlretrieve(url, "bore.zip")
                  with zipfile.ZipFile("bore.zip", 'r') as zip_ref:
                      zip_ref.extractall(".")
                  
                  bore_proc = subprocess.Popen(
                      [".\\bore.exe", "local", "3389", "--to", "bore.pub"],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )
                  
                  b_start = time.time()
                  while time.time() - b_start < 15:
                      b_line = bore_proc.stdout.readline()
                      if not b_line:
                          continue
                      b_match = re.search(r"listening at bore\.pub:([0-9]+)", b_line)
                      if b_match:
                          rdp_address = f"bore.pub:{b_match.group(1)}"
                          proc = bore_proc
                          break
              except Exception as e:
                  print(f"[!] Bore fallback error: {e}")

          if not rdp_address:
              print("[X] Tunnel handshakes timed out.")
              sys.exit(1)

          # طباعة بيانات الاتصال النظيفة
          print("\n" + "=" * 62)
          print("  🎉 TITAN ULTRA FAST-BOOT RDP SESSION IS ACTIVE & READY!")
          print("=" * 62)
          print(f"  👉 Computer / Host : {rdp_address}")
          print("  👉 User Name       : runneradmin")
          print(f"  👉 Password        : {password}")
          print("  👉 Compatibility   : Full Windows 7, 8, 10, 11 Support")
          print("  👉 Latency Engine  : 60 FPS DWM Acceleration (TCP NoDelay)")
          print("  👉 Max Duration    : 6 Hours (360 Minutes)")
          print("=" * 62 + "\n")

          # تسجيل البطاقة في تبويب ملخص GitHub
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "w", encoding="utf-8") as f:
                  f.write("# 🖥️ Titan Ultra Fast-Boot Windows RDP\n\n")
                  f.write("### 🚀 Connection Credentials\n")
                  f.write(f"* **Computer / Host:** `{rdp_address}`\n")
                  f.write("* **Username:** `runneradmin` (or `.\\runneradmin`)\n")
                  f.write(f"* **Password:** `{password}`\n")
                  f.write("* **Performance:** 60 FPS Low Latency (DWM 15ms)\n")
                  f.write("* **Client Compatibility:** Native Windows 7 (Legacy mstsc supported)\n\n")
                  f.write("### 💡 Quick Run Command:\n")
                  f.write(f"```cmd\nmstsc /v:{rdp_address}\n```\n")

          # محرك المراقبة الحية للحفاظ على الجلسة نشطة طوال مدة 6 ساعات
          max_time = 345
          elapsed = 0
          while elapsed < max_time and proc.poll() is None:
              time.sleep(60)
              elapsed += 1
              if elapsed % 10 == 0:
                  print(f"[*] Session Heartbeat: {elapsed} / {max_time} minutes active | Status: Stable")
          EOF
