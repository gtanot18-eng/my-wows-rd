name: AnyDesk Unattended Workstation 2026

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Set AnyDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  anydesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة النظام، اللغة العربية، والوضع الليلي
      # =========================================================================
      - name: Setup System & Arabic
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          try {
              $LangList = Get-WinUserLanguageList
              if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
                  $LangList.Add('ar-SA')
                  Set-WinUserLanguageList -LanguageTag $LangList -Force
              }
          } catch {}

          $ThemePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $ThemePath)) { New-Item -Path $ThemePath -Force | Out-Null }
          Set-ItemProperty -Path $ThemePath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ThemePath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force

      # =========================================================================
      # 2. تثبيت AnyDesk كـ Service وتفعيل Unattended Access القسري
      # =========================================================================
      - name: Install & Configure AnyDesk Unattended
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # 2.1 تحميل وتثبيت AnyDesk كخدمة نظام
          Write-Host "[*] Downloading AnyDesk..." -ForegroundColor Cyan
          $setupFile = Join-Path $env:TEMP "AnyDesk.exe"
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile $setupFile -UseBasicParsing

          Write-Host "[*] Installing AnyDesk Service..." -ForegroundColor Cyan
          Start-Process -FilePath $setupFile -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --start-with-win --silent" -Wait
          Start-Sleep -Seconds 5

          $AnyDeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          # 2.2 إيقاف الخدمة لتعديل الإعدادات
          net stop anydesk 2>&1 | Out-Null

          # 2.3 تعديل ملف system.conf بالسماح التلقائي بالاتصال (interactive_access = 2)
          $confPath = "C:\ProgramData\AnyDesk\system.conf"
          if (Test-Path $confPath) {
              Add-Content -Path $confPath -Value "`nad.security.interactive_access=2`n"
          }

          # 2.4 إعادة تشغيل الخدمة
          net start anydesk 2>&1 | Out-Null
          Start-Sleep -Seconds 5

          # 2.5 تعيين كلمة المرور المباشرة
          $Password = '${{ github.event.inputs.anydesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }
          cmd.exe /c "echo $Password | `"$AnyDeskPath`" --set-password"

          # 2.6 قراءة ה-ID من الملف
          $AnyDeskID = ""
          $retry = 0
          while ([string]::IsNullOrWhiteSpace($AnyDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              if (Test-Path $confPath) {
                  $content = Get-Content $confPath
                  if ($content -match 'ad\.anynet\.id\s*=\s*([0-9\s]+)') {
                      $AnyDeskID = ($matches[1] -replace '\s','').Trim()
                  }
              }
          }

          # 2.7 طباعة البيانات
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " ANYDESK ID : $AnyDeskID" -ForegroundColor Yellow
          Write-Host " PASSWORD   : $Password" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ AnyDesk Ready

          * **AnyDesk ID:** ``$AnyDeskID``
          * **Password:** ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) { Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min" }
          }
