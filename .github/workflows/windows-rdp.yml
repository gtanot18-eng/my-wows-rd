name: Bore Ultra-Stable Unlimited RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، المستخدم، وتحسينات الاستجابة الفائقة
      - name: System & Network Low-Latency Tuning
        shell: powershell
        run: |
          net user TitanAdmin "Matrix#2026!" /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق Bore TCP المباشر بدون قيود وبدون أدوات طرفية على العميل
      - name: Launch Bore Direct TCP Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import urllib.request
          import zipfile

          print("[*] Downloading Bore Tunnel Binary...")
          bore_url = "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip"
          urllib.request.urlretrieve(bore_url, "bore.zip")
          
          with zipfile.ZipFile("bore.zip", 'r') as zip_ref:
              zip_ref.extractall(".")

          print("[*] Launching Bore TCP Relay to bore.pub...")
          proc = subprocess.Popen(
              ["./bore.exe", "local", "3389", "--to", "bore.pub"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_address = None
          start_time = time.time()

          while time.time() - start_time < 35:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean_line = line.strip()
              print(f"[Bore Engine] {clean_line}")

              match = re.search(r"bore\.pub:([0-9]+)", clean_line)
              if match:
                  port = match.group(1)
                  rdp_address = f"bore.pub:{port}"
                  break

          if rdp_address:
              print("\n" + "=" * 60)
              print("[+] DIRECT RDP SESSION ACTIVE & READY")
              print(f" Direct Address : {rdp_address}")
              print(" Username       : TitanAdmin")
              print(" Password       : Matrix#2026!")
              print(" Limit          : Unlimited (350 Minutes Continuous)")
              print(" Windows 7 Mode : 100% Native Compatible (No Client Apps)")
              print("=" * 60 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "w", encoding="utf-8") as f:
                      f.write("### ⚡ Bore Unlimited RDP (Native Windows 7 Direct Connect)\n\n")
                      f.write(f"* **Computer / Address:** `{rdp_address}`\n")
                      f.write("* **Username:** `TitanAdmin`\n")
                      f.write("* **Password:** `Matrix#2026!`\n")
                      f.write("* **Duration:** 350 Minutes (Continuous Session)\n")

              minutes = 0
              while minutes < 340 and proc.poll() is None:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to obtain Bore tunnel port.")
              sys.exit(1)
          EOF
