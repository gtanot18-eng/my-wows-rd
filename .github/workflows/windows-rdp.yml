name: RustDesk Cloud Workstation 2026

on:
  workflow_dispatch:
    inputs:
      rustdesk_password:
        description: 'Set RustDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  rustdesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة النظام، اللغة العربية، والوضع الليلي
      # =========================================================================
      - name: Setup System & Arabic
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          try {
              $LangList = Get-WinUserLanguageList
              if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
                  $LangList.Add('ar-SA')
                  Set-WinUserLanguageList -LanguageTag $LangList -Force
              }
          } catch {}

          $ThemePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $ThemePath)) { New-Item -Path $ThemePath -Force | Out-Null }
          Set-ItemProperty -Path $ThemePath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ThemePath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force

      # =========================================================================
      # 2. تثبيت RustDesk وتوليد الـ ID المباشر
      # =========================================================================
      - name: Install & Launch RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          Write-Host "[*] Downloading RustDesk..." -ForegroundColor Cyan
          winget install --id RustDesk.RustDesk --silent --accept-source-agreements --accept-package-agreements

          Start-Sleep -Seconds 5
          $RustDeskExe = "C:\Program Files\RustDesk\rustdesk.exe"

          # تعيين كلمة المرور المباشرة
          $Password = '${{ github.event.inputs.rustdesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }

          & "$RustDeskExe" --password "$Password"

          # استخراج ID الخاص بالسيرفر
          $RustDeskID = ""
          $retry = 0
          while ([string]::IsNullOrWhiteSpace($RustDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              $rawId = & "$RustDeskExe" --get-id
              if ($rawId -match '\d+') {
                  $RustDeskID = $matches[0]
              }
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " RUSTDESK ID : $RustDeskID" -ForegroundColor Yellow
          Write-Host " PASSWORD    : $Password" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ RustDesk Cloud Workstation Ready

          * **RustDesk ID:** ``$RustDeskID``
          * **Password:** ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) { Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min" }
          }
