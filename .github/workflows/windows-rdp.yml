name: RustDesk Cloud Workstation 2026

on:
  workflow_dispatch:
    inputs:
      rustdesk_password:
        description: 'Set RustDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  rustdesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة اللغة العربية والوضع الليلي
      # =========================================================================
      - name: Setup System & Arabic
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          try {
              $LangList = Get-WinUserLanguageList
              if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
                  $LangList.Add('ar-SA')
                  Set-WinUserLanguageList -LanguageTag $LangList -Force
              }
          } catch {}

          $ThemePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $ThemePath)) { New-Item -Path $ThemePath -Force | Out-Null }
          Set-ItemProperty -Path $ThemePath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ThemePath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force

      # =========================================================================
      # 2. تحميل وتثبيت RustDesk مباشرة وتوليد الـ ID
      # =========================================================================
      - name: Direct Download & Configure RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          
          # 2.1 جلب رابط أحدث إصدار من GitHub API مباشرة لتفادي winget
          Write-Host "[*] Fetching RustDesk installer from GitHub API..." -ForegroundColor Cyan
          $downloadUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.exe"
          try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" -UseBasicParsing
              $asset = $release.assets | Where-Object { $_.name -like "*x86_64.exe" -and $_.name -notlike "*sciter*" } | Select-Object -First 1
              if ($asset) { $downloadUrl = $asset.browser_download_url }
          } catch {}

          $setupExe = Join-Path $env:TEMP "rustdesk_setup.exe"
          Write-Host "[*] Downloading: $downloadUrl" -ForegroundColor Cyan
          Invoke-WebRequest -Uri $downloadUrl -OutFile $setupExe -UseBasicParsing

          # 2.2 التثبيت الصامت كـ Service
          Write-Host "[*] Installing RustDesk Service..." -ForegroundColor Cyan
          Start-Process -FilePath $setupExe -ArgumentList "--silent-install" -Wait
          Start-Sleep -Seconds 6

          $RustDeskPath = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $RustDeskPath)) {
              $RustDeskPath = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          # 2.3 تشغيل الخدمة وتعيين كلمة المرور
          Start-Service -Name "rustdesk" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $Password = '${{ github.event.inputs.rustdesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }

          Write-Host "[*] Setting Password..." -ForegroundColor Cyan
          & "$RustDeskPath" --password "$Password"

          # 2.4 استخراج الـ ID بـ CLI وقراءة ملفات التكوين كـ Fallback
          $RustDeskID = ""
          $retry = 0
          while ([string]::IsNullOrWhiteSpace($RustDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              $rawId = & "$RustDeskPath" --get-id
              if ($rawId -match '\d{9,10}') {
                  $RustDeskID = $matches[0]
              }
          }

          if ([string]::IsNullOrWhiteSpace($RustDeskID)) {
              $configFiles = Get-ChildItem -Path "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config" -Filter "*.toml" -Recurse -ErrorAction SilentlyContinue
              foreach ($file in $configFiles) {
                  $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
                  if ($content -match 'id\s*=\s*"(\d+)"') {
                      $RustDeskID = $matches[1]
                      break
                  }
              }
          }

          # 2.5 طباعة النتيجة
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " 🎉 RUSTDESK CLOUD WORKSTATION ONLINE" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " RUSTDESK ID : $RustDeskID" -ForegroundColor Yellow
          Write-Host " PASSWORD    : $Password" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ RustDesk Cloud Workstation Ready

          * **RustDesk ID:** ``$RustDeskID``
          * **Password:** ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) { Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min" }
          }
