name: Titan Anti-Freeze Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password'
        required: true
        default: 'half'

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة الحساب السريعة، كلمة المرور (half)، وتوافق Windows 7
      # =========================================================================
      - name: Configure System & Windows 7 RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 فك تعقيد كلمة المرور
          $secCfg = Join-Path $env:TEMP 'secpol.cfg'
          $secSdb = Join-Path $env:TEMP 'secpol.sdb'
          secedit /export /cfg $secCfg /quiet
          if (Test-Path $secCfg) {
              $content = Get-Content $secCfg
              $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
              $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
              Set-Content -Path $secCfg -Value $content
              secedit /configure /db $secSdb /cfg $secCfg /areas SECURITYPOLICY /quiet
              Remove-Item $secCfg, $secSdb -Force -ErrorAction SilentlyContinue
          }

          # 1.2 تعيين كلمة المرور
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.3 تفعيل RDP وإلغاء NLA وتخفيض التشفير
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.4 تسريع 60 FPS وTCP NoDelay
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TCPNoDelay' -Value 1 -Type DWord -Force
          Set-MpPreference -DisableRealtimeMonitoring $true

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. تطبيق ثيم Looksmaxxing وتحميل معرض صور PSL Gods على سطح المكتب
      # =========================================================================
      - name: Apply Looksmaxxing Theme & PSL Gods Archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $DesktopPath = 'C:\Users\runneradmin\Desktop'
          $PSLDir = Join-Path $DesktopPath 'PSL_Gods_Archive'
          if (!(Test-Path $PSLDir)) { New-Item -Path $PSLDir -ItemType Directory -Force | Out-Null }

          $Images = @{
              'Main_Wallpaper.jpg'   = 'https://images.wallpapersden.com/image/download/david-gandy-suit_a2lpZ2mUmZqaraWkpJRmbmdlrWZlbWU.jpg'
              'Chico_Lachowski.jpg'  = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Francisco_Lachowski_2011.jpg/800px-Francisco_Lachowski_2011.jpg'
              'Sean_OPry.jpg'        = 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Sean_O%27Pry_2014.jpg/800px-Sean_O%27Pry_2014.jpg'
              'Jordan_Barrett.jpg'   = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Jordan_Barrett_2017.jpg/800px-Jordan_Barrett_2017.jpg'
          }

          $Client = New-Object System.Net.WebClient
          foreach ($img in $Images.Keys) {
              $Target = Join-Path $PSLDir $img
              try { $Client.DownloadFile($Images[$img], $Target) } catch {}
          }

          $WallpaperPath = Join-Path $PSLDir 'Main_Wallpaper.jpg'
          if (Test-Path $WallpaperPath) {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $WallpaperPath -Force
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
              rundll32.exe user32.dll, UpdatePerUserSystemParameters
          }

          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force

      # =========================================================================
      # 3. محرك الأنفاق غير القابل للتعليق (Non-Blocking Anti-Freeze Engine)
      # =========================================================================
      - name: Launch Anti-Freeze Multi-Tunnel Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import threading
          import queue

          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          password = "${{ github.event.inputs.rdp_password }}" or "half"
          max_session_minutes = 350
          global_start = time.time()

          def enqueue_output(out, q):
              for line in iter(out.readline, ''):
                  q.put(line)
              out.close()

          def try_tunnel(cmd, pattern, timeout_sec=8):
              proc = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
                  encoding='utf-8',
                  errors='replace'
              )
              q = queue.Queue()
              t = threading.Thread(target=enqueue_output, args=(proc.stdout, q))
              t.daemon = True
              t.start()

              start = time.time()
              while time.time() - start < timeout_sec:
                  if proc.poll() is not None:
                      break
                  try:
                      line = q.get_nowait()
                  except queue.Empty:
                      time.sleep(0.2)
                      continue

                  clean = line.strip()
                  match = re.search(pattern, clean)
                  if match:
                      return proc, match.group(1)
              
              try:
                  proc.kill()
              except:
                  pass
              return None, None

          print("[*] Launching High-Speed Non-Blocking Tunnel Engine...")

          while (time.time() - global_start) / 60 < max_session_minutes:
              active_proc = None
              rdp_address = None

              # 1. المحاولة الأولى: Pinggy Direct (سريع جداً وموثوق)
              print("[*] Connecting via Primary Fast-Stream Tunnel...")
              pinggy_cmd = [
                  "ssh", "-T", "-p", "443", "-R", "0:localhost:3389",
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "ServerAliveInterval=10",
                  "-o", "ServerAliveCountMax=120",
                  "-o", "TCPKeepAlive=yes",
                  "tcp@a.pinggy.io"
              ]
              active_proc, rdp_address = try_tunnel(pinggy_cmd, r#"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)"#, timeout_sec=10)

              # 2. المحاولة الثانية: Serveo (إذا تعطل الأول مع حماية من التعليق 6 ثوانٍ)
              if not rdp_address:
                  print("[!] Switching to Secondary Tunnel Engine...")
                  serveo_cmd = [
                      "ssh", "-T", "-R", "0:localhost:3389",
                      "-o", "StrictHostKeyChecking=no",
                      "-o", "ServerAliveInterval=10",
                      "serveo.net"
                  ]
                  active_proc, rdp_address = try_tunnel(serveo_cmd, r#"Forwarding TCP traffic from ([a-zA-Z0-9\.\-]+:[0-9]+)"#, timeout_sec=6)

              if rdp_address:
                  print("\n" + "=" * 62)
                  print("  🎉 TITAN RDP WORKSTATION IS ONLINE & READY!")
                  print("=" * 62)
                  print(f"  👉 Host / Address : {rdp_address}")
                  print("  👉 Username       : runneradmin")
                  print(f"  👉 Password       : {password}")
                  print("  👉 Total Duration : 6 Hours (360 Minutes)")
                  print("=" * 62 + "\n")

                  summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summary_file:
                      with open(summary_file, "w", encoding="utf-8") as f:
                          f.write("# 🗿 Titan Active Windows RDP Session\n\n")
                          f.write(f"* **Host / Address:** `{rdp_address}`\n")
                          f.write("* **Username:** `runneradmin`\n")
                          f.write(f"* **Password:** `{password}`\n")
                          f.write("* **Session Limit:** 6 Hours (Auto-Renewing)\n\n")
                          f.write("### 💻 antiX Linux Connection Command:\n")
                          f.write(f"```bash\nxfreerdp /v:{rdp_address} /u:runneradmin /p:{password} /cert:ignore +clipboard /dynamic-resolution /gdi:hw\n```\n")

                  # مراقبة الاتصال وتجديده تلقائياً كل 50 دقيقة قبل انتهاء أي جلسة
                  cycle_start = time.time()
                  while active_proc.poll() is None and (time.time() - global_start) / 60 < max_session_minutes:
                      if (time.time() - cycle_start) / 60 > 50:
                          print("[!] Auto-refreshing tunnel for 6-hour continuous uptime...")
                          break
                      time.sleep(5)

              print("[!] Refreshing tunnel... (All running software and files remain intact)")
              if active_proc:
                  try:
                      active_proc.kill()
                  except:
                      pass
              time.sleep(2)

          print("[*] Session duration completed.")
          EOF
