name: Ultimate Stable RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إنشاء المستخدم ومنح الصلاحيات
      - name: Initialize RDP User
        shell: powershell
        run: |
          net user TitanAdmin P@ssw0rd2026! /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

      # 2. إعدادات الأمان والتوافق مع Windows 7
      - name: Configure Windows 7 RDP Compatibility
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. إطلاق النفق المباشر مع تجاوز فحص المفاتيح
      - name: Launch Port-443 Tunnel
        shell: powershell
        run: |
          $sshArgs = "-p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=20 a.pinggy.io b"
          $proc = Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log" -PassThru

          $rdpAddress = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "tunnel.log") {
                  $content = Get-Content "tunnel.log" -Raw
                  if ($content -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                      $rdpAddress = $matches[1]
                      break
                  }
              }
          }

          if ($rdpAddress) {
              Write-Host "=========================================================="
              Write-Host "RDP CONNECT ADDRESS: $rdpAddress"
              Write-Host "Username           : TitanAdmin"
              Write-Host "Password           : P@ssw0rd2026!"
              Write-Host "=========================================================="

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### RDP Connection Info"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("* Computer: " + $rdpAddress)
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* Username: TitanAdmin"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* Password: P@ssw0rd2026!"
          } else {
              Write-Host "Logs Output:"
              if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
              if (Test-Path "tunnel_err.log") { Get-Content "tunnel_err.log" }
              exit 1
          }

      # 4. إبقاء الجلسة نشطة
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $minutes = 0
          while ($minutes -lt 340) {
              Start-Sleep -Seconds 60
              $minutes++
          }
