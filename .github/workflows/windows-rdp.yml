name: Windows RDP Session Optimized

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء مستخدم مخصص مع منح الصلاحيات
      - name: Create Dedicated RDP User
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. تحميل وتجهيز Ngrok مباشرة
      - name: Download & Setup Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/b4PvuBzDrive/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."

      # 3. إدخال التوكن الخاص بـ Ngrok
      - name: Authenticate Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

      # 4. إصلاح جذر المشكلة: إعدادات الأمان والجدار الناري للـ RDP
      - name: Fix RDP Security & Firewall
        run: |
          # تفعيل الاتصالات البعيدة
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          
          # تعطيل NLA وإجبار استخدام Standard RDP Security (حل مشكلة Securing Connection)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          
          # إيقاف UDP للـ RDP ليعمل عبر TCP النقي فقط مع Ngrok
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fClientDisableUDP" -PropertyType DWORD -Value 1 -Force

          # فتح جميع قواعد الجدار الناري الخاصة بـ RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # تحسين الأداء الإضافي
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

      # 5. تشغيل Ngrok وجلب رابط الاتصال
      - name: Start Ngrok & Display Address
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
          
          $maxRetries = 10
          $retryCount = 0
          $PublicUrl = $null

          while (-not $PublicUrl -and $retryCount -lt $maxRetries) {
              Start-Sleep -Seconds 3
              try {
                  $TunnelInfo = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  # إزالة البادئة tcp:// تلقائياً للطباعة المباشرة
                  $PublicUrl = $TunnelInfo.tunnels[0].public_url -replace "tcp://", ""
              } catch {
                  $retryCount++
              }
          }

          if ($PublicUrl) {
              $SummaryContent = @"
              ### 🖥️ RDP Connection Info
              - **Address:** `$PublicUrl`
              - **Username:** `rdpuser`
              - **Password:** `Password1234!`
              "@
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -InputObject $SummaryContent -Encoding utf8

              Write-Host "==================================================" -ForegroundColor Green
              Write-Host " [!] انسخ العنوان التالي مباشرة لبرنامج RDP:" -ForegroundColor Cyan
              Write-Host " Address  : $PublicUrl" -ForegroundColor Yellow
              Write-Host " Username : rdpuser" -ForegroundColor Yellow
              Write-Host " Password : Password1234!" -ForegroundColor Yellow
              Write-Host "==================================================" -ForegroundColor Green
          } else {
              Write-Host "فشل الاتصال بـ Ngrok، يرجى التأكد من التوكن" -ForegroundColor Red
              exit 1
          }

      # 6. حلقة الإبقاء يعمل مع الفحص
      - name: Keep Alive Loop
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
              if (-not (Get-Process -Name "ngrok" -ErrorAction SilentlyContinue)) {
                  Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
              }
          }
