name: Windows RDP Session Direct

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء مستخدم RDP
      - name: Create Dedicated RDP User
        shell: powershell
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. إعدادات الأمان والتوافق مع Windows 7
      - name: Fix RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. تشغيل النفق المباشر بوضع النص الفوري (Batch Mode)
      - name: Start Direct Tunnel
        shell: powershell
        run: |
          # تشغيل ssh مع تمرير وسيط "b" لطباعة الروابط مباشرة كنص
          Start-Process -FilePath "ssh" -ArgumentList "-p 443", "-R0:localhost:3389", "-o StrictHostKeyChecking=no", "-o ServerAliveInterval=30", "-o TCPKeepAlive=yes", "a.pinggy.io", "b" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log"

          # انتظار توليد الرابط
          Start-Sleep -Seconds 6

          $output = ""
          if (Test-Path "tunnel.log") { $output += (Get-Content "tunnel.log" -Raw) }
          if (Test-Path "tunnel_err.log") { $output += "`n" + (Get-Content "tunnel_err.log" -Raw) }

          Write-Host "================ TUNNEL OUTPUT ================" -ForegroundColor Cyan
          Write-Host $output -ForegroundColor Yellow
          Write-Host "===============================================" -ForegroundColor Cyan

          # استخراج العنوان وطباعته في الـ Summary
          if ($output -match "tcp://(\S+)") {
              $rdpHost = $matches[1]
              Write-Host "[!] Address: $rdpHost" -ForegroundColor Green
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 🖥️ RDP Connection Info"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Address:** `$rdpHost`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Username:** `rdpuser`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Password:** `Password1234!`"
          }

      # 4. إبقاء الجلسة نشطة
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
          }
