name: RustDesk Cloud Workstation 2026

on:
  workflow_dispatch:
    inputs:
      rustdesk_password:
        description: 'Set RustDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  rustdesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة اللغة العربية والوضع الليلي
      # =========================================================================
      - name: Setup System & Arabic
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          try {
              $LangList = Get-WinUserLanguageList
              if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
                  $LangList.Add('ar-SA')
                  Set-WinUserLanguageList -LanguageTag $LangList -Force
              }
          } catch {}

          $ThemePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $ThemePath)) { New-Item -Path $ThemePath -Force | Out-Null }
          Set-ItemProperty -Path $ThemePath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ThemePath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force

      # =========================================================================
      # 2. تحميل وتشغيل RustDesk المباشر وتوليد الـ ID
      # =========================================================================
      - name: Direct Setup & Configure RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          
          # 2.1 إنشاء مجلد مخصص للملف التنفيذي
          $rustdeskDir = "C:\RustDesk"
          New-Item -ItemType Directory -Force -Path $rustdeskDir | Out-Null
          $rustdeskExe = Join-Path $rustdeskDir "rustdesk.exe"

          # 2.2 تحميل أحدث ملف تنفيذي مباشرة
          Write-Host "[*] Downloading RustDesk 1.4.9 Standalone..." -ForegroundColor Cyan
          $downloadUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $rustdeskExe -UseBasicParsing

          # 2.3 تسجيل الخدمة بدون نافذة تثبيت وتأخير لتجنب التجمد
          Write-Host "[*] Registering RustDesk Service Background..." -ForegroundColor Cyan
          Start-Process -FilePath $rustdeskExe -ArgumentList "--install-service" -WindowStyle Hidden
          Start-Sleep -Seconds 6

          # 2.4 تعيين كلمة المرور
          $Password = '${{ github.event.inputs.rustdesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }

          Write-Host "[*] Setting Access Password..." -ForegroundColor Cyan
          & "$rustdeskExe" --password "$Password"
          Start-Sleep -Seconds 3

          # 2.5 استخراج الـ ID
          $RustDeskID = ""
          $retry = 0
          while ([string]::IsNullOrWhiteSpace($RustDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              $rawId = & "$rustdeskExe" --get-id
              if ($rawId -match '\d{9,10}') {
                  $RustDeskID = $matches[0]
              }
          }

          # 2.6 قراءة ملف الإعدادات كـ Fallback في حال تأخر الـ CLI
          if ([string]::IsNullOrWhiteSpace($RustDeskID)) {
              $configFiles = Get-ChildItem -Path "$env:APPDATA\RustDesk\config", "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config" -Filter "*.toml" -Recurse -ErrorAction SilentlyContinue
              foreach ($file in $configFiles) {
                  $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
                  if ($content -match 'id\s*=\s*"(\d+)"') {
                      $RustDeskID = $matches[1]
                      break
                  }
              }
          }

          # 2.7 طباعة النتيجة النهائية
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " 🎉 RUSTDESK CLOUD WORKSTATION ONLINE" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " RUSTDESK ID : $RustDeskID" -ForegroundColor Yellow
          Write-Host " PASSWORD    : $Password" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ RustDesk Cloud Workstation Ready

          * **RustDesk ID:** ``$RustDeskID``
          * **Password:** ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) { Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min" }
          }
