name: Cloudflare Ultra-Low-Latency RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، المستخدم، وتحسينات الاستجابة الفائقة
      - name: System & Network Low-Latency Tuning
        shell: powershell
        run: |
          net user TitanAdmin "Matrix#2026!" /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق Cloudflare TCP المباشر بدون قيود زمنية
      - name: Launch Cloudflare TCP Engine
        shell: powershell
        run: |
          # تحميل أداة Cloudflared الرسمية لويندوز
          curl.exe -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

          # تشغيل النفق وتوجيه مخرجاته لملف السجل
          $proc = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel","--url","tcp://localhost:3389" -RedirectStandardError "cf.log" -PassThru

          $rdpAddress = $null
          for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "cf.log") {
                  $content = Get-Content "cf.log" -Raw
                  if ($content -match "https://([a-zA-Z0-9\-]+\.trycloudflare\.com)") {
                      $rdpAddress = $matches[1]
                      break
                  }
              }
          }

          if ($rdpAddress) {
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "[+] CLOUDFLARE RDP ENGINE ACTIVE & CONNECTED" -ForegroundColor Cyan
              Write-Host " Hostname : $rdpAddress" -ForegroundColor Yellow
              Write-Host " Username : TitanAdmin" -ForegroundColor Yellow
              Write-Host " Password : Matrix#2026!" -ForegroundColor Yellow
              Write-Host " Limit    : Unlimited (Full 350 Minutes Session)" -ForegroundColor Green
              Write-Host "==========================================================" -ForegroundColor Green

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ⚡ Cloudflare Ultra-Fast RDP (No 60m Limit)"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Host:** `$rdpAddress`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Username:** `TitanAdmin`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Password:** `Matrix#2026!`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Access Mode:** High-Speed Anycast Cloudflare Network"
          } else {
              Write-Host "[!] Failed to launch Cloudflared. Log Output:" -ForegroundColor Red
              if (Test-Path "cf.log") { Get-Content "cf.log" }
              exit 1
          }

      # 3. الحفاظ على استمرار الجلسة حتى نهاية الوقت
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $minutes = 0
          while ($minutes -lt 340) {
              Start-Sleep -Seconds 60
              $minutes++
          }
