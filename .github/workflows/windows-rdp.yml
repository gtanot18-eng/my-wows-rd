name: Titan RDP 2026 Pro

on:
  workflow_dispatch:

jobs:
  titan-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إنشاء حساب المستخدم بصلاحيات كاملة
      - name: Initialize RDP Credentials
        shell: powershell
        run: |
          net user TitanAdmin P@ssw0rd2026! /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

      # 2. هندسة الأداء العالي وكسر معدل الإطارات والتوافق مع Windows 7
      - name: Kernel & Network Low-Latency Optimizations
        shell: powershell
        run: |
          # تفعيل الاتصال والتوافق مع التشفير القديم لـ Windows 7
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          # رفع معدل إطارات RDP إلى 60 FPS وتقليل زمن التأخير الرسومي
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          # تسريع شبكة TCP وإلغاء اختناق البيانات (Disable Nagle Algorithm & Network Throttling)
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0

          # إيقاف خدمات الخلفية المستهلكة للمعالج
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          # تطبيق التعديلات وفتح الجدار الناري
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. إطلاق النفق الفوري الذكي واستخراج العنوان
      - name: Launch High-Speed TCP Tunnel
        shell: powershell
        run: |
          # تشغيل الاتصال المباشر مع استخراج عنوان TCP
          $tunnelJob = Start-Job -ScriptBlock {
              ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 a.pinggy.io b
          }

          Start-Sleep -Seconds 8
          $rawOutput = Receive-Job -Job $tunnelJob | Out-String
          
          $hostAddress = $null
          if ($rawOutput -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
              $hostAddress = $matches[1]
          }

          if (-not $hostAddress) {
              # محاولة ثانية للاستخراج
              Start-Sleep -Seconds 4
              $rawOutput = Receive-Job -Job $tunnelJob | Out-String
              if ($rawOutput -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                  $hostAddress = $matches[1]
              }
          }

          if ($hostAddress) {
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host " [✓] TITAN RDP ENGINE IS READY" -ForegroundColor Cyan
              Write-Host " IP & Port  : $hostAddress" -ForegroundColor Yellow
              Write-Host " Username   : TitanAdmin" -ForegroundColor Yellow
              Write-Host " Password   : P@ssw0rd2026!" -ForegroundColor Yellow
              Write-Host "==========================================================" -ForegroundColor Green

              # توليد بطاقة Markdown تفاعلية داخل GitHub Summary
              $SummaryFile = $env:GITHUB_STEP_SUMMARY
              "## ⚡ Titan RDP Session (60 FPS Ultra-Fast)" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| الإعداد | القيمة الخاصة بك |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| :--- | :--- |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| **العنوان (Address)** | \`$hostAddress\` |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| **المستخدم (User)** | \`TitanAdmin\` |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| **كلمة المرور (Pass)** | \`P@ssw0rd2026!\` |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
              "| **معدل الإطارات (FPS)** | **60 FPS Unlocked** |" | Out-File -FilePath $SummaryFile -Encoding utf8 -Append
          } else {
              Write-Host "Tunnel Output Log:" -ForegroundColor Red
              Write-Host $rawOutput
              exit 1
          }

      # 4. مراقبة الجلسة والحفاظ على الثبات التلقائي
      - name: Session Heartbeat & Watchdog
        shell: powershell
        run: |
          Write-Host "[+] Session active. Auto-heartbeat running..." -ForegroundColor Cyan
          $durationMinutes = 0
          while ($durationMinutes -lt 340) {
              Start-Sleep -Seconds 60
              $durationMinutes++
              if ($durationMinutes % 30 -eq 0) {
                  Write-Host "Uptime: $durationMinutes minutes elapsed. Session stable." -ForegroundColor Green
              }
          }
