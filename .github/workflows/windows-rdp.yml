name: Enterprise Ultra-Performance Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Custom RDP Password'
        required: true
        default: 'Titan#Matrix#2026!Pro'

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة الحساب، فك التشفير المقيد، وتوافق Windows 7 الفوري
      # =========================================================================
      - name: Fast System & RDP Initialization
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 ضبط كلمة مرور runneradmin
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'Titan#Matrix#2026!Pro' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.2 إلغاء NLA وتخفيض التشفير (توافق Windows 7 Native)
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.3 تفعيل تسريع 60 FPS وشبكة منخفضة التأخير (Low Latency)
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2 -Force

          $TcpParams = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
          Set-ItemProperty -Path $TcpParams -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $TcpParams -Name 'TCPNoDelay' -Value 1 -Type DWord -Force

          # 1.4 إيقاف Windows Defender لزيادة سرعة النظام
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true

          # 1.5 فتح الجدار الناري وإعادة تشغيل الخدمة
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. توليد اختصارات البرامج المدمجة وسكريبتات الصيانة على سطح المكتب
      # =========================================================================
      - name: Desktop Setup & Utilities
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $DesktopPath = 'C:\Users\runneradmin\Desktop'
          if (!(Test-Path $DesktopPath)) { New-Item -Path $DesktopPath -ItemType Directory -Force | Out-Null }

          # 2.1 سكريبت تنظيف الرام الفوري بنقرة واحدة
          $RamScript = @'
          Write-Host "Flushing RAM and Temporary Cache..." -ForegroundColor Magenta
          Clear-DnsClientCache
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "Memory Cleaned Successfully!" -ForegroundColor Green
          Start-Sleep -Seconds 2
          '@
          [System.IO.File]::WriteAllText((Join-Path $DesktopPath 'Clean_RAM.ps1'), $RamScript, [System.Text.Encoding]::UTF8)

          # 2.2 سكريبت فحص سرعة الإنترنت الحقيقية
          $SpeedScript = @'
          Write-Host "Testing Network Bandwidth..." -ForegroundColor Yellow
          $testUrl = "https://speed.cloudflare.com/__down?bytes=50000000"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $client = New-Object System.Net.WebClient
          $client.DownloadData($testUrl) | Out-Null
          $timer.Stop()
          $mbps = [math]::Round((50 / $timer.Elapsed.TotalSeconds) * 8, 2)
          Write-Host "Speed: $mbps Mbps" -ForegroundColor Green
          Write-Host "Press any key to close..."
          $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          '@
          [System.IO.File]::WriteAllText((Join-Path $DesktopPath 'Speed_Test.ps1'), $SpeedScript, [System.Text.Encoding]::UTF8)

          # 2.3 إظهار امتدادات الملفات وتفعيل المظهر الداكن
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'HideFileExt' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force

      # =========================================================================
      # 3. إطلاق النفق الفوري مع المراقبة الدائمة (جاهز في 15 ثانية)
      # =========================================================================
      - name: Launch Instant Tunnel & Session Watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'Titan#Matrix#2026!Pro' }

          $LogPrimary = Join-Path $env:TEMP 'tunnel_primary.log'
          $ErrPrimary = Join-Path $env:TEMP 'tunnel_primary_err.log'

          # بدء تشغيل نفق Pinggy المباشر
          $PinggyArgs = '-T -p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=10 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes tcp@a.pinggy.io'
          $PrimaryProc = Start-Process -FilePath 'ssh' -ArgumentList $PinggyArgs -RedirectStandardOutput $LogPrimary -RedirectStandardError $ErrPrimary -PassThru

          $RdpAddress = $null
          $Counter = 0
          while ($Counter -lt 25 -and -not $RdpAddress) {
              Start-Sleep -Seconds 1
              $Counter++
              if (Test-Path $LogPrimary) {
                  $Raw = Get-Content $LogPrimary -Raw
                  if ($Raw -match 'tcp://([a-zA-Z0-9\.\-]+:[0-9]+)') {
                      $RdpAddress = $matches[1]
                  }
              }
          }

          if (-not $RdpAddress) {
              Write-Host '[!] Tunnel handshake retry...' -ForegroundColor Yellow
              if (Test-Path $LogPrimary) { Get-Content $LogPrimary }
              exit 1
          }

          # استخراج معلومات الموقع والـ IP
          $GeoInfo = $null
          try { $GeoInfo = (Invoke-RestMethod -Uri 'http://ip-api.com/json' -TimeoutSec 4) } catch {}
          $PublicIP = if ($GeoInfo) { $GeoInfo.query } else { 'Cloud Server IP' }
          $Country  = if ($GeoInfo) { $GeoInfo.country } else { 'Global Cloud' }
          $City     = if ($GeoInfo) { $GeoInfo.city } else { 'Datacenter' }

          # طباعة لوحة التحكم المباشرة
          Write-Host ''
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host '      🎉 INSTANT WINDOWS RDP WORKSTATION IS ONLINE!             ' -ForegroundColor Green
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host "  RDP Address      : $RdpAddress" -ForegroundColor Yellow
          Write-Host '  Username         : runneradmin' -ForegroundColor Cyan
          Write-Host "  Password         : $Password" -ForegroundColor Cyan
          Write-Host "  Location         : $City, $Country" -ForegroundColor Gray
          Write-Host "  Public IP        : $PublicIP" -ForegroundColor Gray
          Write-Host '  Windows 7 Native : Compatible (NLA Disabled / TLS Fallback ON)' -ForegroundColor Green
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host ''

          # إنشاء ملخص الجلسة في واجهة GitHub Summary
          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ Instant Windows Cloud RDP (Active)

          ### 🚀 Connection Credentials
          | Parameter | Value |
          | :--- | :--- |
          | **Computer / Host** | ``$RdpAddress`` |
          | **Username** | ``runneradmin`` (or ``.\runneradmin``) |
          | **Password** | ``$Password`` |
          | **Port Protocol** | Direct TCP / RDP Port 3389 |
          | **Performance** | 60 FPS Low-Latency Engine |

          ### 💡 Quick Run Command (Windows Run / CMD):
          ``mstsc /v:$RdpAddress``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

          # حلقة المراقبة الحية للحفاظ على الجلسة نشطة حتى 6 ساعات
          $TotalMinutes = 350
          $Elapsed = 0

          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++

              if ($Elapsed % 10 -eq 0) {
                  try {
                      $CpuUsage = (Get-Counter '\Processor(_Total)\% Processor Time' -ErrorAction SilentlyContinue).CounterSamples.CookedValue
                      $FreeRam = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024, 0)
                      Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min | CPU: $([math]::Round($CpuUsage, 1))% | Free RAM: ${FreeRam}MB | Status: Active" -ForegroundColor Gray
                  } catch {
                      Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min | Status: Active" -ForegroundColor Gray
                  }
              }

              if ($PrimaryProc.HasExited) {
                  Write-Host '[!] Tunnel interrupted. Auto-reconnecting...' -ForegroundColor Yellow
                  $PrimaryProc = Start-Process -FilePath 'ssh' -ArgumentList $PinggyArgs -RedirectStandardOutput $LogPrimary -RedirectStandardError $ErrPrimary -PassThru
              }
          }
