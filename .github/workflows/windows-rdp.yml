name: Titan Unlimited Matrix RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة المستخدم وتوافق Windows 7 و 60 FPS
      - name: System & Windows 7 Kernel Optimization
        shell: powershell
        run: |
          net user TitanAdmin "Matrix#2026!" /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق TCP ذكي مع مراقبة حية
      - name: Launch Smart Tunnel Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys

          def start_tunnel():
              print("[*] Spawning Raw TCP Tunnel...")
              ssh_cmd = [
                  "ssh",
                  "-T",
                  "-p", "443",
                  "-R", "0:localhost:3389",
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "ServerAliveInterval=15",
                  "-o", "TCPKeepAlive=yes",
                  "tcp@a.pinggy.io"
              ]
              proc = subprocess.Popen(
                  ssh_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1
              )
              
              rdp_address = None
              start_time = time.time()
              while time.time() - start_time < 30:
                  line = proc.stdout.readline()
                  if not line:
                      continue
                  clean_line = line.strip()
                  print(f"[Stream] {clean_line}")
                  match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean_line)
                  if match:
                      rdp_address = match.group(1)
                      break
              return proc, rdp_address

          proc, address = start_tunnel()

          if address:
              print("\n" + "=" * 58)
              print(" [✓] TITAN RDP ACTIVE & READY")
              print(f" Address  : {address}")
              print(" Username : TitanAdmin")
              print(" Password : Matrix#2026!")
              print("=" * 58 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("### 🖥️ Titan RDP Session Active (60 FPS)\n\n")
                      f.write(f"* **Computer / Address:** `{address}`\n")
                      f.write("* **Username:** `TitanAdmin`\n")
                      f.write("* **Password:** `Matrix#2026!`\n")

              # Auto-recovery watchdog loop
              minutes = 0
              while minutes < 340:
                  time.sleep(60)
                  minutes += 1
                  if proc.poll() is not None:
                      print("[!] Tunnel closed. Restarting engine...")
                      proc, address = start_tunnel()
                      if address:
                          print(f"[✓] New Reconnect Address: {address}")
          else:
              print("[!] Failed to obtain TCP tunnel endpoint.")
              sys.exit(1)
          EOF
