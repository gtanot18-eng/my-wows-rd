name: Quantum Matrix Unlimited RDP 2026

on:
  workflow_dispatch:

jobs:
  quantum-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة المستخدم وتوافق Windows 7 و 60 FPS
      - name: System & Windows 7 Kernel Optimization
        shell: powershell
        run: |
          net user QuantumAdmin "Matrix#2026!" /add
          net localgroup Administrators QuantumAdmin /add
          net localgroup "Remote Desktop Users" QuantumAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق Serveo مع توليد منفذ مخصص وتلقائي
      - name: Launch Unlimited TCP Tunnel
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import random
          import re
          import os
          import sys

          print("[*] Initializing Dynamic Port Allocation Engine...")

          rdp_address = None
          max_attempts = 5

          for attempt in range(max_attempts):
              # توليد منفذ عشوائي في نطاق Serveo
              target_port = random.randint(15000, 55000)
              print(f"[*] Attempt {attempt + 1}: Requesting remote port {target_port}...")

              ssh_cmd = [
                  "ssh",
                  "-T",
                  "-R", f"{target_port}:localhost:3389",
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "ServerAliveInterval=15",
                  "-o", "TCPKeepAlive=yes",
                  "serveo.net"
              ]

              proc = subprocess.Popen(
                  ssh_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1
              )

              start_time = time.time()
              allocated = False

              while time.time() - start_time < 12:
                  line = proc.stdout.readline()
                  if not line:
                      continue
                  
                  clean_line = line.strip()
                  print(f"[Stream] {clean_line}")

                  if "Forwarding TCP traffic from" in clean_line or f":{target_port}" in clean_line:
                      rdp_address = f"serveo.net:{target_port}"
                      allocated = True
                      break
                  elif "failed for listen port" in clean_line:
                      print(f"[!] Port {target_port} unavailable, retrying next port...")
                      proc.terminate()
                      break

              if allocated:
                  break

          if rdp_address:
              print("\n" + "=" * 58)
              print(" [✓] UNLIMITED RDP ENGINE ACTIVE & READY")
              print(f" Address  : {rdp_address}")
              print(" Username : QuantumAdmin")
              print(" Password : Matrix#2026!")
              print("=" * 58 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("### 🖥️ Unlimited Quantum RDP Session\n\n")
                      f.write(f"* **Computer / Address:** `{rdp_address}`\n")
                      f.write("* **Username:** `QuantumAdmin`\n")
                      f.write("* **Password:** `Matrix#2026!`\n")

              minutes = 0
              while proc.poll() is None and minutes < 340:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to establish active TCP tunnel.")
              sys.exit(1)
          EOF
