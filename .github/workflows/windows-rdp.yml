name: macOS Cloud Session 2026

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة الشاشة الافتراضية وتفعيل جلسة VNC الرسومية
      - name: Configure macOS GUI & VNC Server
        run: |
          # إضافة مسارات Homebrew على معالجات Apple Silicon
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          # تفعيل خدمة مشاركة الشاشة الرسمية وضبط صلاحيات الواجهة
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "Matrix2026" \
            -restart -agent

          # إجبار النظام على تنشيط نافذة سطح المكتب وتخطي وضع الخمول
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"
          caffeinate -d -i -m -u &

      # 2. إطلاق نفق TCP بنواة Python لربط منفذ VNC (5900)
      - name: Launch macOS TCP Tunnel
        run: |
          python3 -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys

          def start_tunnel():
              print("[*] Spawning Raw TCP Tunnel for macOS GUI (Port 5900)...")
              ssh_cmd = [
                  "ssh",
                  "-T",
                  "-p", "443",
                  "-R", "0:localhost:5900",
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "ServerAliveInterval=15",
                  "-o", "TCPKeepAlive=yes",
                  "tcp@a.pinggy.io"
              ]
              proc = subprocess.Popen(
                  ssh_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1
              )
              
              vnc_address = None
              start_time = time.time()
              while time.time() - start_time < 30:
                  line = proc.stdout.readline()
                  if not line:
                      continue
                  clean_line = line.strip()
                  print(f"[Stream] {clean_line}")
                  match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean_line)
                  if match:
                      vnc_address = match.group(1)
                      break
              return proc, vnc_address

          proc, address = start_tunnel()

          if address:
              print("\n" + "=" * 58)
              print("[+] MACOS CLOUD DESKTOP ACTIVE")
              print(f" VNC Address  : {address}")
              print(" VNC Password : Matrix2026")
              print("=" * 58 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("### 🍏 macOS Cloud Desktop Active\n\n")
                      f.write(f"* **VNC Server / Address:** `{address}`\n")
                      f.write("* **VNC Password:** `Matrix2026`\n")

              minutes = 0
              while minutes < 340:
                  time.sleep(60)
                  minutes += 1
                  if proc.poll() is not None:
                      print("[!] Tunnel closed. Restarting engine...")
                      proc, address = start_tunnel()
                      if address:
                          print(f"[+] New Reconnect Address: {address}")
          else:
              print("[!] Failed to obtain TCP tunnel endpoint.")
              sys.exit(1)
          EOF
