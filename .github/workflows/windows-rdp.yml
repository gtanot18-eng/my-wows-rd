name: AnyDesk Cloud Workstation 2026

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Set AnyDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  anydesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة النظام، اللغة العربية، والوضع الليلي
      # =========================================================================
      - name: Stage 1 - System & Arabic Keyboard Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # إضافة اللغة العربية للكيبورد (Alt + Shift)
          $LangList = Get-WinUserLanguageList
          if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
              $LangList.Add('ar-SA')
              Set-WinUserLanguageList -LanguageTag $LangList -Force
          }

          # تفعيل الوضع الليلي
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force

      # =========================================================================
      # 2. تثبيت AnyDesk وتعيين كلمة المرور واستخراج الـ ID المضمون
      # =========================================================================
      - name: Stage 2 - Install & Configure AnyDesk Service
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          
          # 2.1 التحميل المباشر لـ AnyDesk لتفادي مشاكل winget
          Write-Host "[*] Downloading AnyDesk Executable..." -ForegroundColor Cyan
          $setupFile = Join-Path $env:TEMP "AnyDesk.exe"
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile $setupFile -UseBasicParsing

          # 2.2 تثبيت AnyDesk كخدمة نظام وتثبيته في المجلد الافتراضي
          Write-Host "[*] Installing AnyDesk Silent Service..." -ForegroundColor Cyan
          Start-Process -FilePath $setupFile -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --start-with-win --silent" -Wait

          Start-Sleep -Seconds 5
          $AnyDeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          # 2.3 التأكد من تشغيل خدمة AnyDesk
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue

          # 2.4 تعيين كلمة المرور باستخدام CMD لضمان التمرير الصحيح للأمر
          $Password = '${{ github.event.inputs.anydesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }

          cmd.exe /c "echo $Password | `"$AnyDeskPath`" --set-password"

          # 2.5 حلقة تكرارية لاستخراج AnyDesk ID بنجاح
          $AnyDeskID = ""
          $retry = 0
          while ([string]::IsNullOrWhiteSpace($AnyDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              $rawId = & "$AnyDeskPath" --get-id
              if ($rawId -match '^\d+$') {
                  $AnyDeskID = $rawId.Trim()
              }
          }

          if ([string]::IsNullOrWhiteSpace($AnyDeskID)) {
              Write-Host "[!] Failed to get AnyDesk ID. Retrying force command..." -ForegroundColor Red
              $AnyDeskID = (& "$AnyDeskPath" --get-id).Trim()
          }

          # 2.6 طباعة البيانات
          Write-Host ""
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host "   🎉 ANYDESK CLOUD WORKSTATION IS ONLINE                       " -ForegroundColor Green
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host "  AnyDesk ID  : $AnyDeskID" -ForegroundColor Yellow
          Write-Host "  Password    : $Password" -ForegroundColor Cyan
          Write-Host "  Keyboard    : English + Arabic (ar-SA) [Alt + Shift]" -ForegroundColor Green
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host ""

          # 2.7 إضافة الملخص في صفحة GitHub Actions
          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ AnyDesk Cloud Workstation

          ### 🔑 Connection Credentials
          | Parameter | Value |
          | :--- | :--- |
          | **AnyDesk ID** | ``$AnyDeskID`` |
          | **Password** | ``$Password`` |
          | **Audio & Video** | Native High-Quality Streaming |

          ### 🚀 How to Connect:
          1. Open **AnyDesk** on your PC, Linux/antiX, or Phone.
          2. Enter the ID: ``$AnyDeskID``
          3. Enter Password: ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Stage 3 - Keep Session Alive
        shell: powershell
        run: |
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) {
                  Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min | AnyDesk Active" -ForegroundColor Gray
              }
          }
