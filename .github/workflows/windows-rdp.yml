name: Windows RDP Session Simple

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء المستخدم ومنح الصلاحيات
      - name: Create Dedicated RDP User
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. إعدادات الجدار الناري والتوافق الكامل مع Windows 7
      - name: Fix RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. تشغيل النفق المباشر واستخراج العنوان فوراً
      - name: Start Tunnel & Display Info
        run: |
          # تشغيل اتصال النفق المباشر في الخلفية
          $job = Start-Job -ScriptBlock { 
              ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o TCPKeepAlive=yes a.pinggy.io 
          }
          
          Start-Sleep -Seconds 8
          $output = Receive-Job -Job $job
          $fullText = $output | Out-String
          
          # استخراج عنوان الاتصال تلقائياً
          $rdpAddress = $null
          if ($fullText -match 'tcp://([a-zA-Z0-9\.\-]+:[0-9]+)') {
              $rdpAddress = $matches[1]
          }

          if ($rdpAddress) {
              $Line1 = "### 🖥️ RDP Connection Info"
              $Line2 = "* **Address:** `$rdpAddress`"
              $Line3 = "* **Username:** `rdpuser`"
              $Line4 = "* **Password:** `Password1234!`"
              Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value @($Line1, $Line2, $Line3, $Line4)
              
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host " [!] Address  : $rdpAddress" -ForegroundColor Yellow
              Write-Host " [!] Username : rdpuser" -ForegroundColor Yellow
              Write-Host " [!] Password : Password1234!" -ForegroundColor Yellow
              Write-Host "==================================================" -ForegroundColor Green
          } else {
              Write-Host "Output Dump:" -ForegroundColor Cyan
              Write-Host $fullText
          }

      # 4. إبقاء الجلسة نشطة
      - name: Keep Alive Loop
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
          }
