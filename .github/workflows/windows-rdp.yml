name: Titan Ngrok Looksmaxxing Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token (from dashboard.ngrok.com)'
        required: true
      rdp_password:
        description: 'RDP Password'
        required: true
        default: 'half'

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة الحساب وإلغاء قيود الأمان للتوافق مع Windows 7 (كلمة المرور: half)
      # =========================================================================
      - name: Configure System & Windows 7 RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 فك تعقيد كلمة المرور لقبول 'half'
          $secCfg = Join-Path $env:TEMP 'secpol.cfg'
          $secSdb = Join-Path $env:TEMP 'secpol.sdb'
          secedit /export /cfg $secCfg /quiet
          if (Test-Path $secCfg) {
              $content = Get-Content $secCfg
              $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
              $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
              Set-Content -Path $secCfg -Value $content
              secedit /configure /db $secSdb /cfg $secCfg /areas SECURITYPOLICY /quiet
              Remove-Item $secCfg, $secSdb -Force -ErrorAction SilentlyContinue
          }

          # 1.2 تعيين كلمة المرور والمستخدم runneradmin
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.3 تفعيل RDP وإلغاء NLA وتخفيض التشفير (Windows 7 Native Compatibility)
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.4 تسريع 60 FPS وTCP NoDelay
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TCPNoDelay' -Value 1 -Type DWord -Force
          Set-MpPreference -DisableRealtimeMonitoring $true

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. تطبيق ثيم Looksmaxxing وتحميل معرض صور PSL Gods على سطح المكتب
      # =========================================================================
      - name: Apply Looksmaxxing Theme & PSL Gods Archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $DesktopPath = 'C:\Users\runneradmin\Desktop'
          $PSLDir = Join-Path $DesktopPath 'PSL_Gods_Archive'
          if (!(Test-Path $PSLDir)) { New-Item -Path $PSLDir -ItemType Directory -Force | Out-Null }

          # 2.1 تحميل صور وخلفيات PSL Gods
          $Images = @{
              'Main_Wallpaper.jpg'   = 'https://images.wallpapersden.com/image/download/david-gandy-suit_a2lpZ2mUmZqaraWkpJRmbmdlrWZlbWU.jpg'
              'Chico_Lachowski.jpg'  = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Francisco_Lachowski_2011.jpg/800px-Francisco_Lachowski_2011.jpg'
              'Sean_OPry.jpg'        = 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Sean_O%27Pry_2014.jpg/800px-Sean_O%27Pry_2014.jpg'
              'Jordan_Barrett.jpg'   = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Jordan_Barrett_2017.jpg/800px-Jordan_Barrett_2017.jpg'
              'Aesthetic_Statue.jpg' = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1920&q=80'
          }

          $Client = New-Object System.Net.WebClient
          foreach ($img in $Images.Keys) {
              $Target = Join-Path $PSLDir $img
              try { $Client.DownloadFile($Images[$img], $Target) } catch {}
          }

          # 2.2 تعيين خلفية الشاشة وتفعيل الوضع الداكن
          $WallpaperPath = Join-Path $PSLDir 'Main_Wallpaper.jpg'
          if (Test-Path $WallpaperPath) {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $WallpaperPath -Force
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
              rundll32.exe user32.dll, UpdatePerUserSystemParameters
          }

          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force

          # 2.3 كتابة سكريبت التوجيهات على سطح المكتب بدون مشاكل أسطر YAML
          $Lines = @(
              'Write-Host "==========================================================" -ForegroundColor Cyan',
              'Write-Host "         LOOKSMAXXING / PSL GODS WORKSTATION 2026         " -ForegroundColor Yellow',
              'Write-Host "==========================================================" -ForegroundColor Cyan',
              'Write-Host "[*] Hunter Eyes Activated (Canthal Tilt Positive)" -ForegroundColor Green',
              'Write-Host "[*] Bone Density & Angular Jawline Optimized" -ForegroundColor Green',
              'Write-Host "[*] Lean Body Mass Target: 10-12% Bodyfat" -ForegroundColor Green',
              'Write-Host ""',
              'Write-Host "PSL Gods Gallery located in: Desktop\PSL_Gods_Archive" -ForegroundColor Magenta',
              'Write-Host "==========================================================" -ForegroundColor Cyan',
              'Write-Host "Press any key to close..."',
              '$null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")'
          )
          [System.IO.File]::WriteAllLines((Join-Path $DesktopPath 'Looksmaxxing_Mantra.ps1'), $Lines, [System.Text.Encoding]::UTF8)

      # =========================================================================
      # 3. تثبيت وتشغيل نفق Ngrok فائق السرعة والمراقبة الدائمة
      # =========================================================================
      - name: Launch Fast Ngrok Tunnel & Watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $NgrokToken = '${{ github.event.inputs.ngrok_token }}'
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          # 3.1 تحميل وفك ضغط Ngrok
          Write-Host '[*] Downloading Ngrok v3...' -ForegroundColor Cyan
          Invoke-WebRequest -Uri 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip' -OutFile 'ngrok.zip'
          Expand-Archive -Path 'ngrok.zip' -DestinationPath '.' -Force

          # 3.2 تسجيل التوكن وبدء النفق
          .\ngrok.exe config add-authtoken $NgrokToken
          Start-Process -FilePath '.\ngrok.exe' -ArgumentList 'tcp 3389 --log=stdout' -RedirectStandardOutput 'ngrok.log' -WindowStyle Hidden

          # 3.3 استخراج عنوان الاتصال
          $rdpAddress = $null
          $attempts = 0
          while ($attempts -lt 20 -and -not $rdpAddress) {
              Start-Sleep -Seconds 2
              $attempts++
              try {
                  $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4040/api/tunnels' -ErrorAction Stop
                  if ($response.tunnels -and $response.tunnels.Count -gt 0) {
                      $rdpAddress = $response.tunnels[0].public_url.Replace('tcp://', '')
                  }
              } catch {
                  Write-Host "[*] Waiting for Ngrok tunnel (Attempt $attempts/20)..." -ForegroundColor Yellow
              }
          }

          if (-not $rdpAddress) {
              Write-Host '[!] Failed to establish Ngrok tunnel. Inspecting logs:' -ForegroundColor Red
              if (Test-Path 'ngrok.log') { Get-Content 'ngrok.log' }
              exit 1
          }

          # 3.4 طباعة بيانات الاتصال
          Write-Host ''
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host '  NGROK LOOKSMAXXING WORKSTATION ONLINE & READY                 ' -ForegroundColor Green
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host "  Address  : $rdpAddress" -ForegroundColor Yellow
          Write-Host '  Username : runneradmin' -ForegroundColor Cyan
          Write-Host "  Password : $Password" -ForegroundColor Cyan
          Write-Host '  Theme    : PSL Gods / Sharp Dark Aesthetic' -ForegroundColor Magenta
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host ''

          # 3.5 حفظ الملخص في صفحة الـ Actions
          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryLines = @(
                  '# Looksmaxxing Windows RDP Session',
                  '',
                  '### Connection Credentials',
                  "* **Computer / Host:** ``$rdpAddress``",
                  '* **Username:** ``runneradmin``',
                  "* **Password:** ``$Password``",
                  '* **Tunnel Provider:** Ngrok TCP',
                  '* **Desktop Theme:** PSL Gods Aesthetic Archive'
              )
              [System.IO.File]::WriteAllLines($env:GITHUB_STEP_SUMMARY, $SummaryLines, [System.Text.Encoding]::UTF8)
          }

          # 3.6 إبقاء الجلسة نشطة لمدة 6 ساعات
          $minutes = 0
          while ($minutes -lt 345) {
              Start-Sleep -Seconds 60
              $minutes++
              if ($minutes % 10 -eq 0) {
                  Write-Host "[*] Session Heartbeat: $minutes / 345 minutes active (Stable)" -ForegroundColor Gray
              }
          }
