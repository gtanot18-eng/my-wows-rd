name: Windows RDP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Provisioning Script
        shell: powershell
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          .\setup.ps1

      - name: Enable RDP & Start Bore Tunnel
        shell: powershell
        run: |
          # 1. تعيين كلمة مرور للحساب
          $Password = ConvertTo-SecureString "P@ssword1234!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

          # 2. تفعيل خدمة وجدار حماية RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # 3. تنزيل أداة bore
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip" -UseBasicParsing
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

          # 4. تشغيل النفق وإبقاء العملية قائمة
          Write-Host "=== CONNECT TO YOUR RDP AT THE PORT BELOW ===" -ForegroundColor Green
          cmd.exe /c "bore.exe local 3389 --to bore.pub"
