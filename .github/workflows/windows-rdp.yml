name: Bore Ultra-Fast RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إنشاء المستخدم المخصص
      - name: Initialize RDP User
        shell: powershell
        run: |
          net user TitanAdmin P@ssw0rd2026! /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

      # 2. هندسة التوافق مع Windows 7 وكسر معدل الإطارات إلى 60 FPS
      - name: Configure Low-Latency RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. إطلاق محرك Bore Rust واستخراج عنوان الاتصال
      - name: Launch Bore TCP Engine
        shell: powershell
        run: |
          # تحميل محرك Bore الرسمي المترجم للويندوز
          curl.exe -L -o bore.zip "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip"
          tar.exe -xf bore.zip

          # تشغيل النفق المباشر إلى المنفذ 3389
          $proc = Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore_err.log" -PassThru

          $assignedPort = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "bore.log") {
                  $logContent = Get-Content "bore.log" -Raw
                  if ($logContent -match "listening at bore\.pub:(\d+)") {
                      $assignedPort = $matches[1]
                      break
                  }
              }
          }

          if ($assignedPort) {
              $fullAddress = "bore.pub:$assignedPort"
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "[*] BORE RDP ENGINE CONNECTED SUCCESSFULLY" -ForegroundColor Cyan
              Write-Host "Address  : $fullAddress" -ForegroundColor Yellow
              Write-Host "Username : TitanAdmin" -ForegroundColor Yellow
              Write-Host "Password : P@ssw0rd2026!" -ForegroundColor Yellow
              Write-Host "==========================================================" -ForegroundColor Green

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ⚡ Bore RDP Session Ready (60 FPS)"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Address:** `$fullAddress`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Username:** `TitanAdmin`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Password:** `P@ssw0rd2026!`"
          } else {
              Write-Host "Bore Log Output:" -ForegroundColor Red
              if (Test-Path "bore.log") { Get-Content "bore.log" }
              if (Test-Path "bore_err.log") { Get-Content "bore_err.log" }
              exit 1
          }

      # 4. الحفاظ على استمرار الجلسة
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $minutes = 0
          while ($minutes -lt 340) {
              Start-Sleep -Seconds 60
              $minutes++
          }
