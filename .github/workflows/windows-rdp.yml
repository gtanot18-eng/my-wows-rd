name: RustDesk Cloud Workstation 2026

on:
  workflow_dispatch:
    inputs:
      rustdesk_password:
        description: 'Set RustDesk Password'
        required: true
        default: 'P@ssword1234!'

jobs:
  rustdesk-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة اللغة العربية والوضع الليلي
      # =========================================================================
      - name: Setup System & Arabic
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          try {
              $LangList = Get-WinUserLanguageList
              if (-not ($LangList.LanguageTag -contains 'ar-SA')) {
                  $LangList.Add('ar-SA')
                  Set-WinUserLanguageList -LanguageTag $LangList -Force
              }
          } catch {}

          $ThemePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $ThemePath)) { New-Item -Path $ThemePath -Force | Out-Null }
          Set-ItemProperty -Path $ThemePath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ThemePath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force

      # =========================================================================
      # 2. تثبيت RustDesk بصلاحيات المسؤول المباشرة واستخراج الـ ID
      # =========================================================================
      - name: Install & Launch RustDesk Service
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # 2.1 تنزيل ملف التثبيت
          $setupExe = Join-Path $env:TEMP "rustdesk_setup.exe"
          Write-Host "[*] Downloading RustDesk Setup..." -ForegroundColor Cyan
          $downloadUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $setupExe -UseBasicParsing

          # 2.2 التثبيت الصامت بصلاحيات المسؤول Elevated
          Write-Host "[*] Installing RustDesk with Admin Privileges..." -ForegroundColor Cyan
          Start-Process -FilePath $setupExe -ArgumentList "--silent-install" -Verb RunAs -Wait
          Start-Sleep -Seconds 10

          $RustDeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $RustDeskExe)) {
              $RustDeskExe = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          # 2.3 تشغيل الخدمة وتعيين كلمة المرور
          net start rustdesk 2>&1 | Out-Null
          Start-Sleep -Seconds 5

          $Password = '${{ github.event.inputs.rustdesk_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'P@ssword1234!' }

          Write-Host "[*] Setting Access Password..." -ForegroundColor Cyan
          Start-Process -FilePath $RustDeskExe -ArgumentList "--password $Password" -Verb RunAs -Wait
          Start-Sleep -Seconds 3

          # 2.4 استخراج الـ ID المباشر من ملفات التكوين (TOML) لتفادي أخطاء Pipe
          $RustDeskID = ""
          $configPaths = @(
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk2.toml",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
              "$env:APPDATA\RustDesk\config\RustDesk2.toml",
              "$env:APPDATA\RustDesk\config\RustDesk.toml"
          )

          $retry = 0
          while ([string]::IsNullOrWhiteSpace($RustDeskID) -and $retry -lt 15) {
              Start-Sleep -Seconds 2
              $retry++
              foreach ($path in $configPaths) {
                  if (Test-Path $path) {
                      $content = Get-Content $path -Raw
                      if ($content -match 'id\s*=\s*"(\d+)"' -or $content -match 'id\s*=\s*(\d+)') {
                          $RustDeskID = $matches[1]
                          break
                      }
                  }
              }
          }

          # 2.5 طباعة البيانات النهائية
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " 🎉 RUSTDESK CLOUD WORKSTATION ONLINE" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " RUSTDESK ID : $RustDeskID" -ForegroundColor Yellow
          Write-Host " PASSWORD    : $Password" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🖥️ RustDesk Cloud Workstation Ready

          * **RustDesk ID:** ``$RustDeskID``
          * **Password:** ``$Password``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

      # =========================================================================
      # 3. الحفاظ على تشغيل الجلسة
      # =========================================================================
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $TotalMinutes = 350
          $Elapsed = 0
          while ($Elapsed -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $Elapsed++
              if ($Elapsed % 10 -eq 0) { Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min" }
          }
