name: Windows RDP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Provisioning Script
        shell: powershell
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          .\setup.ps1
