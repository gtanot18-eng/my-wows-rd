name: Ultimate Stable RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إنشاء المستخدم ومنح الصلاحيات
      - name: Initialize RDP User
        shell: powershell
        run: |
          net user TitanAdmin P@ssw0rd2026! /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

      # 2. إعدادات الأمان والتوافق مع Windows 7
      - name: Configure Windows 7 RDP Compatibility
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. إطلاق النفق وقراءة العنوان فورياً بدون حجز الذاكرة
      - name: Launch Real-Time TCP Tunnel
        shell: powershell
        run: |
          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "ssh.exe"
          $pinfo.Arguments = "-p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 a.pinggy.io b"
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.UseShellExecute = $false
          $pinfo.CreateNoWindow = $true

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $pinfo
          $process.Start() | Out-Null

          $rdpAddress = $null
          $attempts = 0

          while (-not $rdpAddress -and $attempts -lt 25) {
              Start-Sleep -Seconds 1
              while (-not $process.StandardOutput.EndOfStream) {
                  $line = $process.StandardOutput.ReadLine()
                  Write-Host "[SSH Output] $line"
                  if ($line -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                      $rdpAddress = $matches[1]
                      break
                  }
              }
              $attempts++
          }

          if ($rdpAddress) {
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "SUCCESS: RDP IS READY TO CONNECT" -ForegroundColor Cyan
              Write-Host "Address  : $rdpAddress" -ForegroundColor Yellow
              Write-Host "Username : TitanAdmin" -ForegroundColor Yellow
              Write-Host "Password : P@ssw0rd2026!" -ForegroundColor Yellow
              Write-Host "==========================================================" -ForegroundColor Green

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### RDP Connection Info"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("* **Computer / Address:** " + $rdpAddress)
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Username:** TitanAdmin"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Password:** P@ssw0rd2026!"
          } else {
              Write-Host "Failed to capture address in stream." -ForegroundColor Red
              exit 1
          }

      # 4. إبقاء الجلسة نشطة
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $minutes = 0
          while ($minutes -lt 340) {
              Start-Sleep -Seconds 60
              $minutes++
          }
