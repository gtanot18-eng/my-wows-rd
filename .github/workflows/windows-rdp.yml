name: Developer & Cinema Edition Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password'
        required: true
        default: 'half'

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. تهيئة النظام، المستخدم runneradmin وتوافق Windows 7 (كلمة المرور: half)
      # =========================================================================
      - name: Stage 1 - Account & Windows 7 Legacy RDP Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 فك تعقيد كلمة المرور
          $secCfg = Join-Path $env:TEMP 'secpol.cfg'
          $secSdb = Join-Path $env:TEMP 'secpol.sdb'
          secedit /export /cfg $secCfg /quiet
          if (Test-Path $secCfg) {
              $content = Get-Content $secCfg
              $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
              $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
              Set-Content -Path $secCfg -Value $content
              secedit /configure /db $secSdb /cfg $secCfg /areas SECURITYPOLICY /quiet
              Remove-Item $secCfg, $secSdb -Force -ErrorAction SilentlyContinue
          }

          # 1.2 تعيين كلمة المرور والمجموعات
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.3 تفعيل RDP وإلغاء NLA وتخفيض التشفير للتوافق مع mstsc و xfreerdp
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.4 تفعيل 60 FPS وإلغاء اختناق الماوس والشبكة
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TCPNoDelay' -Value 1 -Type DWord -Force
          Set-MpPreference -DisableRealtimeMonitoring $true

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. تطبيق الثيم الأسود وتحميل حزمة خلفيات الأفلام والمسلسلات العالمية
      # =========================================================================
      - name: Stage 2 - Apply Dark Theme & Cinema Wallpapers Depot
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $DesktopPath = 'C:\Users\runneradmin\Desktop'
          $CinemaDir = Join-Path $DesktopPath 'Cinema_Wallpapers'
          if (!(Test-Path $CinemaDir)) { New-Item -Path $CinemaDir -ItemType Directory -Force | Out-Null }

          # 2.1 تحميل باقة خلفيات سينمائية بدقة 4K (Interstellar, Dark Knight, Cyberpunk, Peaky Blinders)
          $Wallpapers = @{
              '01_Interstellar_Gargantua.jpg'    = 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1920&q=80'
              '02_Dark_Knight_Gotham.jpg'        = 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1920&q=80'
              '03_Blade_Runner_Neon.jpg'         = 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80'
              '04_Cinema_Film_Noir.jpg'          = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1920&q=80'
              '05_Deep_Space_Cosmos.jpg'         = 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80'
          }

          $Client = New-Object System.Net.WebClient
          foreach ($wp in $Wallpapers.Keys) {
              $Target = Join-Path $CinemaDir $wp
              try { $Client.DownloadFile($Wallpapers[$wp], $Target) } catch {}
          }

          # 2.2 تعيين خلفية الشاشة وتفعيل الوضع الليلي الكامل (Dark Theme)
          $DefaultWallpaper = Join-Path $CinemaDir '01_Interstellar_Gargantua.jpg'
          if (Test-Path $DefaultWallpaper) {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $DefaultWallpaper -Force
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
              rundll32.exe user32.dll, UpdatePerUserSystemParameters
          }

          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force

          # 2.3 سكريبت تحميل أي فيلم، حلقة، أو مقطع يوتيوب بجودة 4K على سطح المكتب
          $DownloaderLines = @(
              'Write-Host "==========================================================" -ForegroundColor Cyan',
              'Write-Host "         CINEMA & MEDIA 4K VIDEO DOWNLOADER               " -ForegroundColor Yellow',
              'Write-Host "==========================================================" -ForegroundColor Cyan',
              '$url = Read-Host "Paste Video URL (YouTube, Vimeo, Media Source)"',
              'if ($url) {',
              '    $outDir = "C:\Users\runneradmin\Desktop\Cinema_Wallpapers\%(title)s.%(ext)s"',
              '    Write-Host "[*] Downloading in Highest Quality via yt-dlp..." -ForegroundColor Magenta',
              '    winget install --id yt-dlp.yt-dlp --silent --accept-source-agreements --accept-package-agreements',
              '    yt-dlp -f "bestvideo+bestaudio/best" --no-playlist -o $outDir $url',
              '    Write-Host "[✓] Media saved successfully!" -ForegroundColor Green',
              '}',
              'Start-Sleep -Seconds 3'
          )
          [System.IO.File]::WriteAllLines((Join-Path $DesktopPath 'Download_Media_4K.ps1'), $DownloaderLines, [System.Text.Encoding]::UTF8)

      # =========================================================================
      # 3. تثبيت Android Studio وLively Wallpaper والأدوات في الخلفية (بدون تأخير الإقلاع)
      # =========================================================================
      - name: Stage 3 - Background Deployment for Android Studio & Lively Wallpaper
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $ScriptPath = Join-Path $env:TEMP 'Install_Apps.ps1'

          # سكريبت تثبيت تلقائي يشتغل في الخلفية فور تشغيل النظام
          $InstallScript = @'
          Start-Sleep -Seconds 5
          winget install --id Google.AndroidStudio --silent --accept-source-agreements --accept-package-agreements
          winget install --id rocksdanister.LivelyWallpaper --silent --accept-source-agreements --accept-package-agreements
          winget install --id VideoLAN.VLC --silent --accept-source-agreements --accept-package-agreements
          winget install --id 7zip.7zip --silent --accept-source-agreements --accept-package-agreements
          '@
          [System.IO.File]::WriteAllText($ScriptPath, $InstallScript, [System.Text.Encoding]::UTF8)

          # إطلاق التثبيت في عملية منفصلة بالخلفية لفتح الـ RDP فوراً
          Start-Process powershell.exe -ArgumentList "-ExecutionPolicy Bypass -File $ScriptPath" -WindowStyle Hidden

      # =========================================================================
      # 4. تشغيل نفق Bore TCP النقي والمراقبة الحية (فتح خلال 8 ثوانٍ)
      # =========================================================================
      - name: Stage 4 - Launch Pure Bore TCP Engine & Live Session Watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          # 4.1 تحميل محرك Bore المستقل
          Write-Host '[*] Initializing Pure Bore TCP Multiplexer...' -ForegroundColor Cyan
          $zipPath = Join-Path $env:TEMP 'bore.zip'
          $boreDir = Join-Path $env:TEMP 'bore'
          $url = 'https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip'
          (New-Object System.Net.WebClient).DownloadFile($url, $zipPath)
          Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force

          $boreExe = Join-Path $boreDir 'bore.exe'
          $logPath = Join-Path $env:TEMP 'bore.log'

          # 4.2 إطلاق النفق وتوجيه المنفذ 3389
          $proc = Start-Process -FilePath $boreExe -ArgumentList 'local 3389 --to bore.pub' -RedirectStandardOutput $logPath -RedirectStandardError (Join-Path $env:TEMP 'bore_err.log') -PassThru

          # 4.3 استخراج المنفذ المخصص فورياً
          $rdpAddress = $null
          $attempts = 0
          while ($attempts -lt 25 -and -not $rdpAddress) {
              Start-Sleep -Seconds 1
              $attempts++
              if (Test-Path $logPath) {
                  $content = Get-Content $logPath -Raw
                  if ($content -match 'listening at bore\.pub:([0-9]+)') {
                      $rdpAddress = 'bore.pub:' + $matches[1]
                  }
              }
          }

          if (-not $rdpAddress) {
              Write-Host '[!] Bore tunnel negotiation failed. Logs:' -ForegroundColor Red
              if (Test-Path $logPath) { Get-Content $logPath }
              exit 1
          }

          # 4.4 طباعة لوحة التحكم
          Write-Host ''
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host '  🎉 DEVELOPER & CINEMA WORKSTATION ONLINE (FAST BOOT ACTIVE)   ' -ForegroundColor Green
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host "  RDP Address      : $rdpAddress" -ForegroundColor Yellow
          Write-Host '  Username         : runneradmin' -ForegroundColor Cyan
          Write-Host "  Password         : $Password" -ForegroundColor Cyan
          Write-Host '  Theme            : Deep Dark Mode + 4K Cinema Wallpapers' -ForegroundColor Magenta
          Write-Host '  Preloaded Apps   : Android Studio, Lively Wallpaper, VLC, 7-Zip' -ForegroundColor Green
          Write-Host '================================================================' -ForegroundColor Green
          Write-Host ''

          # 4.5 كتابة ملخص الجلسة في GitHub Summary
          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🎬 Developer & Cinema Edition Windows RDP

          ### 🚀 Connection Credentials
          | Parameter | Value |
          | :--- | :--- |
          | **Host / Address** | ``$rdpAddress`` |
          | **Username** | ``runneradmin`` |
          | **Password** | ``$Password`` |
          | **Installed Suite** | Android Studio, Lively Wallpaper, VLC Player |
          | **Wallpapers Hub** | ``Desktop\Cinema_Wallpapers`` |

          ### 💻 antiX Linux Connection Command:
          ``xfreerdp /v:$rdpAddress /u:runneradmin /p:$Password /cert:ignore +clipboard /dynamic-resolution /gdi:hw``

          ### 🖥️ Windows Connection Command:
          ``mstsc /v:$rdpAddress``
          "@
              [System.IO.File]::WriteAllText($env:GITHUB_STEP_SUMMARY, $SummaryMarkdown, [System.Text.Encoding]::UTF8)
          }

          # 4.6 حلقة المراقبة الحية للحفاظ على الجلسة حتى 6 ساعات
          $TotalMinutes = 350
          $Elapsed = 0

          while ($Elapsed -lt $TotalMinutes -and -not $proc.HasExited) {
              Start-Sleep -Seconds 60
              $Elapsed++

              if ($Elapsed % 10 -eq 0) {
                  Write-Host "[Heartbeat] Uptime: $Elapsed / $TotalMinutes min | Workstation Active" -ForegroundColor Gray
              }
          }
