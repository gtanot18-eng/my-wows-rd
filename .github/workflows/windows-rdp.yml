name: Windows RDP Session Direct

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء مستخدم RDP
      - name: Create Dedicated RDP User
        shell: powershell
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. إعدادات الأمان والتوافق مع Windows 7
      - name: Fix RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. تشغيل النفق المباشر عبر SSH المدمج بدون تحميل ملفات خارجية
      - name: Start Direct Tunnel
        shell: powershell
        run: |
          # تشغيل اتصال النفق المباشر وحفظ المخرجات في ملف نصي
          Start-Process -FilePath "ssh" -ArgumentList "-p 443", "-R0:localhost:3389", "-o StrictHostKeyChecking=no", "-o ServerAliveInterval=30", "-o TCPKeepAlive=yes", "a.pinggy.io" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log"

          # انتظار توليد الرابط
          Start-Sleep -Seconds 10

          if (Test-Path "tunnel.log") {
              $logContent = Get-Content "tunnel.log" -Raw
              Write-Host "================ TUNNEL OUTPUT ================" -ForegroundColor Cyan
              Write-Host $logContent -ForegroundColor Yellow
              Write-Host "===============================================" -ForegroundColor Cyan

              # كتابة ملخص الاتصال
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### RDP Connection Info"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Check the step logs above for the generated tcp:// address"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Username: rdpuser"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Password: Password1234!"
          } else {
              Write-Host "Failed to capture tunnel log." -ForegroundColor Red
              if (Test-Path "tunnel_err.log") { Get-Content "tunnel_err.log" }
          }

      # 4. إبقاء الجلسة نشطة
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
          }
