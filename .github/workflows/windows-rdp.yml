name: Windows RDP Session Optimized

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء مستخدم مخصص مع منح الصلاحيات
      - name: Create Dedicated RDP User
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. إعدادات الأمان والجدار الناري للـ RDP والتوافق مع Windows 7
      - name: Fix RDP Security & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. تثبيت وتشغيل Playit وجلب الـ Claim Link
      - name: Setup Playit.gg
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "playit.exe"
          
          if ($env:PLAYIT_SECRET_KEY) {
              Write-Host "[+] Secret Key Found. Starting Playit Agent in background..." -ForegroundColor Green
              Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret", "$env:PLAYIT_SECRET_KEY"
          } else {
              Write-Host "[!] Generating Claim URL and Code..." -ForegroundColor Yellow
              
              # تشغيل playit وتوجيه المخرجات إلى ملف نصي
              $process = Start-Process -FilePath ".\playit.exe" -RedirectStandardOutput "playit_log.txt" -RedirectStandardError "playit_err.txt" -PassThru
              
              $claimUrl = $null
              $attempts = 0
              while (-not $claimUrl -and $attempts -lt 15) {
                  Start-Sleep -Seconds 2
                  if (Test-Path "playit_log.txt") {
                      $content = Get-Content "playit_log.txt" -Raw
                      if ($content -match "https://playit\.gg/claim/\S+") {
                          $claimUrl = $matches[0]
                      }
                  }
                  $attempts++
              }

              if ($claimUrl) {
                  Write-Host "==================================================" -ForegroundColor Green
                  Write-Host " [!] CLAIM URL FOUND:" -ForegroundColor Cyan
                  Write-Host " $claimUrl" -ForegroundColor Yellow
                  Write-Host "==================================================" -ForegroundColor Green

                  $Line1 = "### 🔗 Playit.gg Claim URL"
                  $Line2 = "افتح الرابط التالي لربط الـ Agent وحفظ المفتاح:"
                  $Line3 = "* [$claimUrl]($claimUrl)"
                  Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value @($Line1, $Line2, $Line3)
              } else {
                  Write-Host "Logs Output:" -ForegroundColor Red
                  if (Test-Path "playit_log.txt") { Get-Content "playit_log.txt" }
                  if (Test-Path "playit_err.txt") { Get-Content "playit_err.txt" }
              }
          }

      # 4. حلقة الإبقاء يعمل (Keep Alive Loop)
      - name: Keep Alive Loop
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
              if (-not (Get-Process -Name "playit" -ErrorAction SilentlyContinue)) {
                  if ($env:PLAYIT_SECRET_KEY) {
                      Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret", "$env:PLAYIT_SECRET_KEY"
                  }
              }
          }
