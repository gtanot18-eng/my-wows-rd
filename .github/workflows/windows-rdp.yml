name: Titan RDP 2026 Pro

on:
  workflow_dispatch:

jobs:
  titan-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إنشاء المستخدم المخصص
      - name: Initialize RDP Credentials
        shell: powershell
        run: |
          net user TitanAdmin P@ssw0rd2026! /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

      # 2. تفعيل التوافق مع Windows 7 وكسر السرعة إلى 60 FPS
      - name: Kernel and Network Low-Latency Optimizations
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0

          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. إطلاق النفق المباشر واستخراج العنوان
      - name: Launch High-Speed TCP Tunnel
        shell: powershell
        run: |
          $tunnelJob = Start-Job -ScriptBlock {
              ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 a.pinggy.io b
          }

          Start-Sleep -Seconds 8
          $rawOutput = Receive-Job -Job $tunnelJob | Out-String
          
          $hostAddress = $null
          if ($rawOutput -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
              $hostAddress = $matches[1]
          }

          if (-not $hostAddress) {
              Start-Sleep -Seconds 5
              $rawOutput = Receive-Job -Job $tunnelJob | Out-String
              if ($rawOutput -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                  $hostAddress = $matches[1]
              }
          }

          if ($hostAddress) {
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "[*] TITAN RDP ENGINE READY" -ForegroundColor Cyan
              Write-Host "Address  : $hostAddress" -ForegroundColor Yellow
              Write-Host "Username : TitanAdmin" -ForegroundColor Yellow
              Write-Host "Password : P@ssw0rd2026!" -ForegroundColor Yellow
              Write-Host "==========================================================" -ForegroundColor Green

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Titan RDP Session Ready (60 FPS)"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Address:** $hostAddress"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Username:** TitanAdmin"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **Password:** P@ssw0rd2026!"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "* **FPS Mode:** 60 FPS Unlocked"
          } else {
              Write-Host "Tunnel Output Log:" -ForegroundColor Red
              Write-Host $rawOutput
              exit 1
          }

      # 4. مراقبة الجلسة والحفاظ على الثبات
      - name: Session Heartbeat
        shell: powershell
        run: |
          Write-Host "[+] Session active. Heartbeat loop started..." -ForegroundColor Cyan
          $durationMinutes = 0
          while ($durationMinutes -lt 340) {
              Start-Sleep -Seconds 60
              $durationMinutes++
              if ($durationMinutes % 30 -eq 0) {
                  Write-Host "Session running: $durationMinutes minutes." -ForegroundColor Green
              }
          }
