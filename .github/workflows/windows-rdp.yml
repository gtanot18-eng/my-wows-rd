name: Free Windows RDP (No Credit Card)

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة صلاحيات الدخول وتوافق ويندوز 7
      - name: Configure System & RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          
          # تعيين كلمة المرور لحساب runneradmin
          net user runneradmin Matrix2026Pass
          net localgroup Administrators runneradmin /add
          net localgroup "Remote Desktop Users" runneradmin /add

          # إلغاء NLA وتخفيض مستوى التشفير ليعمل مع mstsc على Windows 7
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1

          # ضبط الأداء وسرعة الاستجابة 60 FPS
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق TCP مباشر بدون بطاقة بنكية
      - name: Launch Free Direct TCP Tunnel
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys

          print("[*] Starting Free Pinggy TCP Tunnel on port 3389...")
          ssh_cmd = [
              "ssh",
              "-T",
              "-p", "443",
              "-R", "0:localhost:3389",
              "-o", "StrictHostKeyChecking=no",
              "-o", "ServerAliveInterval=15",
              "-o", "TCPKeepAlive=yes",
              "tcp@a.pinggy.io"
          ]

          proc = subprocess.Popen(
              ssh_cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_address = None
          start_time = time.time()

          while time.time() - start_time < 30:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean_line = line.strip()
              print(f"[Tunnel Stream] {clean_line}")

              match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean_line)
              if match:
                  rdp_address = match.group(1)
                  break

          if rdp_address:
              print("\n" + "=" * 60)
              print("[+] RDP SESSION READY - NO CREDIT CARD REQUIRED")
              print(f" Computer / Host : {rdp_address}")
              print(" Username        : runneradmin")
              print(" Password        : Matrix2026Pass")
              print("=" * 60 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "w", encoding="utf-8") as f:
                      f.write("### ⚡ Active Windows RDP Session\n\n")
                      f.write(f"* **Computer:** `{rdp_address}`\n")
                      f.write("* **Username:** `runneradmin`\n")
                      f.write("* **Password:** `Matrix2026Pass`\n")

              minutes = 0
              while minutes < 340 and proc.poll() is None:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to obtain TCP tunnel endpoint.")
              sys.exit(1)
          EOF
