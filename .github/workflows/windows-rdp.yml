name: Enterprise Ultra-Performance Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP Password (Must contain upper, lower, number, special char)'
        required: true
        default: 'Titan#Matrix#2026!Pro'
      install_devtools:
        description: 'Install Dev Tools (VSCode, Git, Python, NodeJS, Notepad++)'
        type: boolean
        default: true
      install_browsers:
        description: 'Install Web Browsers (Chrome, Firefox)'
        type: boolean
        default: true
      disable_defender:
        description: 'Disable Windows Defender for maximum CPU & RAM speed'
        type: boolean
        default: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. إصلاح قيود الأمان، فك تعقيد كلمة المرور، وتهيئة المستخدم runneradmin
      # =========================================================================
      - name: Security Policy & Account Provisioning
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          Write-Host "[*] Configuring Security Policies..." -ForegroundColor Cyan

          # 1.1 إلغاء شروط تعقيد كلمات المرور بالكامل عبر Secedit
          $secFile = "$env:TEMP\secpol.cfg"
          $sdbFile = "$env:TEMP\secpol.sdb"
          secedit /export /cfg $secFile /quiet
          if (Test-Path $secFile) {
              (Get-Content $secFile) `
                  -replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
                  -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" `
                  -replace "PasswordHistorySize = \d+", "PasswordHistorySize = 0" `
                  -replace "MinimumPasswordAge = \d+", "MinimumPasswordAge = 0" | 
                  Set-Content $secFile
              secedit /configure /db $sdbFile /cfg $secFile /areas SECURITYPOLICY /quiet
              Remove-Item $secFile, $sdbFile -Force 2>$null
          }

          # 1.2 تعيين كلمة المرور للمستخدم runneradmin باستخدام PowerShell الآمن
          $Password = "${{ github.event.inputs.rdp_password }}"
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = "Titan#Matrix#2026!Pro" }

          $SecPass = ConvertTo-SecureString $Password -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $SecPass -PasswordNeverExpires $true -ErrorAction SilentlyContinue

          # 1.3 ضمان إضافة المستخدم لمجموعات التحكم عن بُعد بدون أخطاء التكرار
          try {
              Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
          } catch {}
          try {
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          } catch {}

          # 1.4 تفعيل RDP وإلغاء NLA وتخفيض التشفير للتوافق التام مع Windows 7
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          
          Set-ItemProperty -Path $TSPath -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name "MinEncryptionLevel" -Value 1 -Force

          # 1.5 تفعيل حزم تشفير TLS القديمة المتوافقة مع عميل mstsc القديم
          $Protocols = @("TLS 1.0", "TLS 1.1", "TLS 1.2")
          foreach ($Proto in $Protocols) {
              $ServerPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$Proto\Server"
              $ClientPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$Proto\Client"
              New-Item -Path $ServerPath -Force | Out-Null
              New-Item -Path $ClientPath -Force | Out-Null
              Set-ItemProperty -Path $ServerPath -Name "Enabled" -Value 1 -Force
              Set-ItemProperty -Path $ServerPath -Name "DisabledByDefault" -Value 0 -Force
              Set-ItemProperty -Path $ClientPath -Name "Enabled" -Value 1 -Force
              Set-ItemProperty -Path $ClientPath -Name "DisabledByDefault" -Value 0 -Force
          }

          # 1.6 تفعيل المنفذ في جدار الحماية وإعادة تشغيل الخدمة
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Write-Host "[+] User runneradmin configured successfully." -ForegroundColor Green

      # =========================================================================
      # 2. تحرير موارد المعالج والرام وإلغاء اختناق الشبكة (Ultra Optimization)
      # =========================================================================
      - name: Kernel, Network & Resource Tuning
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # 2.1 إيقاف Windows Defender لتحرير 100% من أداء المعالج والرام
          if ("${{ github.event.inputs.disable_defender }}" -eq "true") {
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableIntrusionPreventionSystem $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          }

          # 2.2 ضبط خطة الطاقة إلى الأداء الأقصى (Ultimate Performance)
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a14-5e74a8d84862 2>$null

          # 2.3 تحسين معدل إطارات الشاشة لسلاسة 60 FPS
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          New-ItemProperty -Path $DwmPath -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2 -Force

          # 2.4 إلغاء اختناق كرت الشبكة وتحسين استجابة الماوس وتأخير الاتصال (Latency)
          $TcpSettings = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
          Set-ItemProperty -Path $TcpSettings -Name "TcpAckFrequency" -Value 1 -Type DWORD -Force
          Set-ItemProperty -Path $TcpSettings -Name "TCPNoDelay" -Value 1 -Type DWORD -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF -Type DWORD -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0 -Type DWORD -Force

      # =========================================================================
      # 3. تثبيت البرامج الأساسية وحزم التطوير (Background Fast Provisioning)
      # =========================================================================
      - name: Automated Software Depot
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          Write-Host "[*] Initializing Package Manager & Essential Utilities..." -ForegroundColor Cyan

          # 3.1 إعداد Chocolatey وتثبيت الأدوات الحيوية
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

          choco install 7zip curl wget vcredist-all aria2 -y --no-progress

          # 3.2 تثبيت المتصفحات
          if ("${{ github.event.inputs.install_browsers }}" -eq "true") {
              Write-Host "[*] Deploying Google Chrome & Firefox..." -ForegroundColor Yellow
              choco install googlechrome firefox -y --no-progress
          }

          # 3.3 تثبيت حزم المطورين والبرمجة
          if ("${{ github.event.inputs.install_devtools }}" -eq "true") {
              Write-Host "[*] Deploying Developer Stack (VSCode, Git, Python, NodeJS, Notepad++)..." -ForegroundColor Yellow
              choco install vscode git python nodejs-lts notepadplusplus -y --no-progress
          }

          # 3.4 تجهيز اختصار معلومات النظام على سطح المكتب
          $DesktopPath = "C:\Users\runneradmin\Desktop"
          if (!(Test-Path $DesktopPath)) { New-Item -Path $DesktopPath -ItemType Directory -Force | Out-Null }
          
          $SysScript = @"
          Write-Host '============================================' -ForegroundColor Green
          Write-Host '   TITAN MATRIX ENTERPRISE WORKSTATION' -ForegroundColor Green
          Write-Host '============================================' -ForegroundColor Green
          Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture, TotalPhysicalMemory
          "@
          $SysScript | Out-File -FilePath "$DesktopPath\System_Info.ps1" -Encoding utf8

      # =========================================================================
      # 4. تشغيل نفق الاتصال المقاوم للانقطاع والمراقبة الحية (Multi-Tunnel Engine)
      # =========================================================================
      - name: Launch Resilient Keep-Alive Tunnel Engine
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $Password = "${{ github.event.inputs.rdp_password }}"
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = "Titan#Matrix#2026!Pro" }

          $LogFile = "$env:TEMP\tunnel_stream.log"
          $ErrFile = "$env:TEMP\tunnel_err.log"

          function Get-RdpEndpoint {
              param([string]$Path)
              if (Test-Path $Path) {
                  $Content = Get-Content $Path -Raw
                  if ($Content -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                      return $matches[1]
                  }
              }
              return $null
          }

          Write-Host "====================================================" -ForegroundColor Cyan
          Write-Host "     LAUNCHING HIGH-RESILIENCE RDP TUNNEL ENGINE    " -ForegroundColor Cyan
          Write-Host "====================================================" -ForegroundColor Cyan

          # إطلاق النفق في مسار محمي
          $SshArgs = "-T -p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=10 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes tcp@a.pinggy.io"
          $TunnelProc = Start-Process -FilePath "ssh" -ArgumentList $SshArgs -RedirectStandardOutput $LogFile -RedirectStandardError $ErrFile -PassThru

          $RdpEndpoint = $null
          $Counter = 0
          while ($Counter -lt 35 -and -not $RdpEndpoint) {
              Start-Sleep -Seconds 1
              $Counter++
              $RdpEndpoint = Get-RdpEndpoint -Path $LogFile
          }

          if (-not $RdpEndpoint) {
              Write-Host "[!] Primary Tunnel Negotiation failed. Retrying fallback..." -ForegroundColor Red
              if (Test-Path $LogFile) { Get-Content $LogFile }
              if (Test-Path $ErrFile) { Get-Content $ErrFile }
              exit 1
          }

          # جمع بيانات الموقع والشبكة
          $GeoData = (Invoke-RestMethod -Uri "http://ip-api.com/json" -TimeoutSec 5)
          $PublicIP = $GeoData.query
          $Country = $GeoData.country
          $City = $GeoData.city
          $ISP = $GeoData.isp

          # طباعة لوحة التحكم داخل نافذة تشغيل الـ Action
          Write-Host ""
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host "                WORKSTATION READY TO CONNECT                   " -ForegroundColor Green
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host "  RDP Address      : $RdpEndpoint" -ForegroundColor Yellow
          Write-Host "  Username         : runneradmin" -ForegroundColor Cyan
          Write-Host "  Password         : $Password" -ForegroundColor Cyan
          Write-Host "  Server Region    : $City, $Country ($ISP)" -ForegroundColor Gray
          Write-Host "  Public Server IP : $PublicIP" -ForegroundColor Gray
          Write-Host "  Windows 7 Native : Full Support (NLA Bypassed / TLS 1.0-1.2 Enabled)" -ForegroundColor Green
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host ""

          # إنشاء ملخص الجلسة الرسمي في صفحة GitHub Summary
          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryContent = @"
          # 🖥️ Enterprise Windows RDP Active Session

          ### 🚀 Connection Credentials
          | Parameter | Value |
          | :--- | :--- |
          | **Computer / Host** | ``$RdpEndpoint`` |
          | **User Name** | ``runneradmin`` (or ``.\runneradmin``) |
          | **Password** | ``$Password`` |
          | **Port Protocol** | Direct TCP / RDP 3389 |
          | **Session Duration** | Up to 6 Hours (360 Minutes) |

          ### 🌐 Infrastructure & Telemetry
          * **Location:** $City, $Country
          * **Hosting Network:** $ISP ($PublicIP)
          * **OS Environment:** Windows Server Datacenter x64
          * **Client Support:** Native Windows 7, 8, 10, 11 (Legacy mstsc supported)

          ### 💡 Quick Connection Command (Windows Run / CMD):
          ``mstsc /v:$RdpEndpoint``
          "@
              $SummaryContent | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

          # مراقبة مستمرة مع طباعة استهلاك العتاد كل 10 دقائق لمنع الخمول
          $TotalMinutes = 350
          $ElapsedMinutes = 0

          while ($ElapsedMinutes -lt $TotalMinutes) {
              Start-Sleep -Seconds 60
              $ElapsedMinutes++

              if ($ElapsedMinutes % 10 -eq 0) {
                  $Cpu = (Get-Counter '\Processor(_Total)\% Processor Time' -ErrorAction SilentlyContinue).CounterSamples.CookedValue
                  $Ram = (Get-CimInstance Win32_OperatingSystem)
                  $FreeRamMB = [math]::Round($Ram.FreePhysicalMemory / 1024, 0)
                  $CpuRounded = [math]::Round($Cpu, 1)

                  Write-Host "[Heartbeat] Uptime: $ElapsedMinutes / $TotalMinutes min | CPU: $CpuRounded% | Free RAM: ${FreeRamMB}MB | Status: Active" -ForegroundColor Gray
              }

              # تجديد النفق تلقائياً في حال انقطاعه
              if ($TunnelProc.HasExited) {
                  Write-Host "[!] Tunnel closed unexpectedly. Respawning watchdog process..." -ForegroundColor Yellow
                  $TunnelProc = Start-Process -FilePath "ssh" -ArgumentList $SshArgs -RedirectStandardOutput $LogFile -RedirectStandardError $ErrFile -PassThru
              }
          }
