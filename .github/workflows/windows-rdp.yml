name: Quantum Matrix RDP 2026

on:
  workflow_dispatch:

jobs:
  quantum-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، المستخدم، وتوافق Windows 7
      - name: System & Windows 7 Kernel Optimization
        shell: powershell
        run: |
          net user QuantumAdmin "Matrix#2026!" /add
          net localgroup Administrators QuantumAdmin /add
          net localgroup "Remote Desktop Users" QuantumAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل محرك الأنفاق الذكي بنواة Python
      - name: Launch Quantum Tunnel Core
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys

          print("[*] Starting Quantum Tunneling Engine...")

          # Launch unbuffered SSH TCP reverse tunnel
          ssh_cmd = [
              "ssh",
              "-p", "443",
              "-R", "0:localhost:3389",
              "-o", "StrictHostKeyChecking=no",
              "-o", "ServerAliveInterval=15",
              "-o", "TCPKeepAlive=yes",
              "a.pinggy.io",
              "b"
          ]

          proc = subprocess.Popen(
              ssh_cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_address = None
          start_time = time.time()

          # Scan stream for active TCP endpoint
          while time.time() - start_time < 35:
              line = proc.stdout.readline()
              if not line:
                  continue
              
              clean_line = line.strip()
              print(f"[Core Stream] {clean_line}")
              
              match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean_line)
              if match:
                  rdp_address = match.group(1)
                  break

          if rdp_address:
              print("\n" + "=" * 58)
              print(" [✓] QUANTUM RDP ACTIVE & CONNECTED")
              print(f" Address  : {rdp_address}")
              print(" Username : QuantumAdmin")
              print(" Password : Matrix#2026!")
              print("=" * 58 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("## ⚡ Quantum RDP Session (60 FPS)\n\n")
                      f.write("| Attribute | Value |\n")
                      f.write("| :--- | :--- |\n")
                      f.write(f"| **Computer / Address** | `{rdp_address}` |\n")
                      f.write("| **Username** | `QuantumAdmin` |\n")
                      f.write("| **Password** | `Matrix#2026!` |\n")
                      f.write("| **Client Mode** | Native Windows 7 / 10 / 11 |\n")

              # Heartbeat monitor loop
              minutes = 0
              while proc.poll() is None and minutes < 340:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to obtain TCP tunnel endpoint.")
              sys.exit(1)
          EOF
