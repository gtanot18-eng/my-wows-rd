name: Cloudflare Ultra-Low-Latency RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، المستخدم، وتعديلات الأداء
      - name: System & Network Low-Latency Tuning
        shell: powershell
        run: |
          net user TitanAdmin "Matrix#2026!" /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق Cloudflare بنواة Python لتفادي أخطاء الصياغة
      - name: Launch Cloudflare TCP Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import urllib.request

          print("[*] Downloading Official Cloudflared Engine...")
          cf_url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          urllib.request.urlretrieve(cf_url, "cloudflared.exe")

          print("[*] Launching Cloudflare Tunnel...")
          proc = subprocess.Popen(
              ["./cloudflared.exe", "tunnel", "--url", "tcp://localhost:3389"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_host = None
          start_time = time.time()

          while time.time() - start_time < 45:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean_line = line.strip()
              print(f"[Cloudflare] {clean_line}")

              match = re.search(r"https://([a-zA-Z0-9\-]+\.trycloudflare\.com)", clean_line)
              if match:
                  rdp_host = match.group(1)
                  break

          if rdp_host:
              print("\n" + "=" * 60)
              print("[+] CLOUDFLARE RDP ENGINE READY (NO TIME LIMIT)")
              print(f" Hostname : {rdp_host}")
              print(" Username : TitanAdmin")
              print(" Password : Matrix#2026!")
              print("=" * 60 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("### Cloudflare Ultra-Fast RDP\n\n")
                      f.write(f"* **Host:** {rdp_host}\n")
                      f.write("* **Username:** TitanAdmin\n")
                      f.write("* **Password:** Matrix#2026!\n")

              minutes = 0
              while minutes < 340 and proc.poll() is None:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to obtain Cloudflare tunnel URL.")
              sys.exit(1)
          EOF
