name: Packetriot Continuous 60FPS RDP

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، المستخدم، وتحسينات الاستجابة الفائقة
      - name: System & Network Low-Latency Tuning
        shell: powershell
        run: |
          net user TitanAdmin "Matrix#2026!" /add
          net localgroup Administrators TitanAdmin /add
          net localgroup "Remote Desktop Users" TitanAdmin /add

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "NetworkThrottlingIndex" -Value 0xFFFFFFFF
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name "SystemResponsiveness" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق TCP المباشر عبر محرك Telebit المفتوح (بدون قيود زمنية)
      - name: Launch Continuous TCP Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys

          print("[*] Downloading & Launching Dedicated Tunnel Engine...")

          # استخدام عميل Telebit الرسمي لنفق TCP مستمر بدون مهلة 60 دقيقة
          cmd = "curl -s https://get.telebit.io | bash && ~/telebit tcp 3389"
          
          # تشغيل أمر النفق كعملية مستقلة
          proc = subprocess.Popen(
              ["powershell", "-Command", "Invoke-WebRequest -Uri https://get.telebit.io/windows -OutFile tb.exe; .\\tb.exe tcp 3389"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_address = None
          start_time = time.time()

          while time.time() - start_time < 45:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean_line = line.strip()
              print(f"[Engine] {clean_line}")

              # التقاط الرابط المباشر
              match = re.search(r"((?:[a-zA-Z0-9\-]+\.)+telebit\.io:[0-9]+)", clean_line)
              if match:
                  rdp_address = match.group(1)
                  break

          # كخيار احتياطي فوري إذا تأخر Telebit: استخدام نفق TCP الخام عبر Loophole
          if not rdp_address:
              print("[*] Falling back to Loophole Low-Latency TCP Relay...")
              lh_proc = subprocess.Popen(
                  ["powershell", "-Command", "Invoke-WebRequest -Uri https://github.com/loophole/cli/releases/download/1.0.0-beta.15/loophole-windows-amd64.zip -OutFile lh.zip; Expand-Archive lh.zip -DestinationPath .; .\\loophole.exe tcp 3389 --hostname random"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1
              )
              lh_start = time.time()
              while time.time() - lh_start < 30:
                  line = lh_proc.stdout.readline()
                  if not line:
                      continue
                  clean_line = line.strip()
                  print(f"[Loophole] {clean_line}")
                  match = re.search(r"((?:[a-zA-Z0-9\-]+\.)+loophole\.site:[0-9]+)", clean_line)
                  if match:
                      rdp_address = match.group(1)
                      proc = lh_proc
                      break

          if rdp_address:
              print("\n" + "=" * 60)
              print("[+] UNLIMITED STABLE RDP SESSION IS READY")
              print(f" Address  : {rdp_address}")
              print(" Username : TitanAdmin")
              print(" Password : Matrix#2026!")
              print(" Time     : 350 Minutes (Continuous - No 60m Limit)")
              print("=" * 60 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "w", encoding="utf-8") as f:
                      f.write("### ⚡ Continuous High-Speed RDP (Unlimited Session)\n\n")
                      f.write(f"* **Address:** `{rdp_address}`\n")
                      f.write("* **Username:** `TitanAdmin`\n")
                      f.write("* **Password:** `Matrix#2026!`\n")
                      f.write("* **Limit:** None (Active for the full 6 hours)\n")

              # حلقة الحفاظ على استمرار السيرفر حتى نهاية الوقت
              minutes = 0
              while minutes < 340 and proc.poll() is None:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to establish direct continuous tunnel.")
              sys.exit(1)
          EOF
