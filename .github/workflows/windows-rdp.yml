name: Standard Fast Windows RDP 2026

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Custom RDP Password'
        required: true
        default: 'half'

jobs:
  rdp-deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 1. فك شروط تعقيد كلمة المرور وتهيئة الحساب للتوافق مع Windows 7
      # =========================================================================
      - name: Configure System & Windows 7 RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1.1 إلغاء قيود طول وتعقيد كلمة المرور لقبول 'half'
          $secFile = Join-Path $env:TEMP "secpol.cfg"
          $sdbFile = Join-Path $env:TEMP "secpol.sdb"
          secedit /export /cfg $secFile /quiet
          if (Test-Path $secFile) {
              $cfgContent = Get-Content $secFile
              $cfgContent = $cfgContent -replace "PasswordComplexity = 1", "PasswordComplexity = 0"
              $cfgContent = $cfgContent -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0"
              $cfgContent = $cfgContent -replace "PasswordHistorySize = \d+", "PasswordHistorySize = 0"
              $cfgContent = $cfgContent -replace "MinimumPasswordAge = \d+", "MinimumPasswordAge = 0"
              Set-Content -Path $secFile -Value $cfgContent
              secedit /configure /db $sdbFile /cfg $secFile /areas SECURITYPOLICY /quiet
              Remove-Item -Path $secFile, $sdbFile -Force -ErrorAction SilentlyContinue
          }

          # 1.2 تعيين كلمة المرور
          $Password = '${{ github.event.inputs.rdp_password }}'
          if ([string]::IsNullOrWhiteSpace($Password)) { $Password = 'half' }

          net user runneradmin $Password /expires:never /active:yes
          net localgroup Administrators runneradmin /add
          net localgroup 'Remote Desktop Users' runneradmin /add

          # 1.3 تفعيل RDP وإلغاء NLA وتخفيض التشفير (Windows 7 Native)
          $TSPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $WStPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $TSPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $WStPath -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $WStPath -Name 'MinEncryptionLevel' -Value 1 -Force

          # 1.4 تحسين الأداء وإلغاء تأخير الاستجابة
          $DwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $DwmPath -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-MpPreference -DisableRealtimeMonitoring $true

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service -Name TermService -Force

      # =========================================================================
      # 2. إطلاق محرك الأنفاق فائق السرعة عبر نظام البث المباشر
      # =========================================================================
      - name: Launch High-Speed Direct Tunnel
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import urllib.request
          import zipfile

          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          password = "${{ github.event.inputs.rdp_password }}" or "half"
          rdp_address = None

          print("[*] Launching Primary High-Speed TCP Engine (Pinggy Direct Stream)...")
          ssh_cmd = [
              "ssh",
              "-T",
              "-p", "443",
              "-R", "0:localhost:3389",
              "-o", "StrictHostKeyChecking=no",
              "-o", "ServerAliveInterval=10",
              "-o", "ServerAliveCountMax=120",
              "-o", "TCPKeepAlive=yes",
              "tcp@a.pinggy.io"
          ]

          proc = subprocess.Popen(
              ssh_cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
              encoding='utf-8',
              errors='replace'
          )

          start_t = time.time()
          while time.time() - start_t < 20:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean = line.strip()
              match = re.search(r"tcp://([a-zA-Z0-9\.\-]+:[0-9]+)", clean)
              if match:
                  rdp_address = match.group(1)
                  break

          # خطة بديلة فورية باستخدام Bore Engine في حال تأخر النفق الأول
          if not rdp_address:
              print("[!] Switching to Bore Failover Engine...")
              try:
                  url = "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip"
                  urllib.request.urlretrieve(url, "bore.zip")
                  with zipfile.ZipFile("bore.zip", 'r') as zip_ref:
                      zip_ref.extractall(".")
                  
                  bore_proc = subprocess.Popen(
                      [".\\bore.exe", "local", "3389", "--to", "bore.pub"],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )
                  
                  b_start = time.time()
                  while time.time() - b_start < 15:
                      b_line = bore_proc.stdout.readline()
                      if not b_line:
                          continue
                      b_match = re.search(r"listening at bore\.pub:([0-9]+)", b_line)
                      if b_match:
                          rdp_address = f"bore.pub:{b_match.group(1)}"
                          proc = bore_proc
                          break
              except Exception as e:
                  print(f"[!] Bore fallback error: {e}")

          if not rdp_address:
              print("[X] Failed to establish tunnel.")
              sys.exit(1)

          # طباعة بيانات الاتصال
          print("\n" + "=" * 60)
          print("[✓] RDP SESSION IS ACTIVE & READY")
          print(f"  Address  : {rdp_address}")
          print("  Username : runneradmin")
          print(f"  Password : {password}")
          print("=" * 60 + "\n")

          # حفظ الملخص في صفحة GitHub Actions
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "w", encoding="utf-8") as f:
                  f.write("### 🚀 Active Windows RDP Session\n\n")
                  f.write(f"* **Host / Address:** `{rdp_address}`\n")
                  f.write("* **Username:** `runneradmin`\n")
                  f.write(f"* **Password:** `{password}`\n")

          # إبقاء السيرفر نشطاً طوال مدة الـ 6 ساعات
          max_time = 345
          elapsed = 0
          while elapsed < max_time and proc.poll() is None:
              time.sleep(60)
              elapsed += 1
              if elapsed % 10 == 0:
                  print(f"[*] Server Uptime: {elapsed} / {max_time} minutes (Active)")
          EOF
