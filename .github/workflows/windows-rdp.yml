name: Windows RDP with Ngrok

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: System & Windows 7 Optimization
        shell: powershell
        run: |
          # ضبط كلمة المرور للمستخدم runneradmin
          $adminUser = "runneradmin"
          $password = "Matrix2026Pass"
          net user $adminUser $password
          net localgroup Administrators $adminUser /add
          net localgroup "Remote Desktop Users" $adminUser /add

          # تفعيل RDP وتعطيل NLA والتشفير المقيد للتوافق التام مع Windows 7
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1

          # تسريع إطارات العرض لـ 60 FPS
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Launch Ngrok Tunnel & Display Connection Info
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # تحميل وفك ضغط Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          # تسجيل التوكن وتشغيل النفق في الخلفية
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5

          # استخراج عنوان الاتصال
          $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels
          $rdpAddress = $tunnels[0].public_url.Replace("tcp://", "")

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " [✓] RDP SESSION IS ACTIVE" -ForegroundColor Green
          Write-Host " Computer / Address : $rdpAddress" -ForegroundColor Yellow
          Write-Host " Username           : runneradmin" -ForegroundColor Cyan
          Write-Host " Password           : Matrix2026Pass" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          # إضافة التفاصيل لصفحة Summary في GitHub
          if ($env:GITHUB_STEP_SUMMARY) {
              "### 🚀 Ngrok Windows RDP Session" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
              "* **Computer:** ``$rdpAddress``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "* **Username:** ``runneradmin``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "* **Password:** ``Matrix2026Pass``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # إبقاء السيرفر نشطاً لمدة 6 ساعات
          $minutes = 0
          while ($minutes -lt 340) {
              Start-Sleep -Seconds 60
              $minutes++
          }
