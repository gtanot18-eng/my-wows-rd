name: Standard Windows RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة النظام، كلمة المرور، وتوافق Windows 7
      - name: Setup System & Windows 7 RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # تعيين بيانات المستخدم runneradmin
          $user = "runneradmin"
          $pass = "Matrix2026Pass"
          net user $user$pass
          net localgroup Administrators $user /add
          net localgroup "Remote Desktop Users" $user /add

          # تفعيل RDP وإلغاء NLA والتشفير المقيد للتوافق التام مع Windows 7
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1

          # تسريع إطارات الشاشة 60 FPS
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل النفق المباشر بطريقة الـ Native Process النظيفة
      - name: Launch Clean RDP Tunnel
        shell: powershell
        run: |
          # إطلاق النفق في الخلفية وتوجيه المخرجات لملف مؤقت
          $sshJob = Start-Process -FilePath "ssh" -ArgumentList "-T -p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=200 tcp@a.pinggy.io" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log" -PassThru

          # استخراج عنوان الاتصال النظيف
          $rdpUrl = $null$attempts = 0
          while ($attempts -lt 30 -and -not$rdpUrl) {
              Start-Sleep -Seconds 1
              $attempts++
              if (Test-Path "tunnel.log") {
                  $log = Get-Content "tunnel.log" -Raw
                  if ($log -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                      $rdpUrl =$matches[1]
                  }
              }
          }

          if (-not $rdpUrl) {
              Write-Host "[!] Tunnel startup failed. Log:" -ForegroundColor Red
              if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
              exit 1
          }

          # طباعة بيانات الاتصال
          Write-Host ""
          Write-Host "====================================================" -ForegroundColor Green
          Write-Host "  WINDOWS RDP SERVER IS READY AND RUNNING" -ForegroundColor Green
          Write-Host "====================================================" -ForegroundColor Green
          Write-Host "  Address  : $rdpUrl" -ForegroundColor Yellow
          Write-Host "  Username : runneradmin" -ForegroundColor Cyan
          Write-Host "  Password : Matrix2026Pass" -ForegroundColor Cyan
          Write-Host "====================================================" -ForegroundColor Green
          Write-Host ""

          # إضافة الرابط في ملخص GitHub Summary
          if ($env:GITHUB_STEP_SUMMARY) {
              "### 🖥️ Windows RDP Server Info`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
              "* **Computer / Host:** ``$rdpUrl```n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "* **Username:** ``runneradmin`` (or ``.\runneradmin``)`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "* **Password:** ``Matrix2026Pass```n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # إبقاء السيرفر نشطاً مع طباعة دورية هادئة كل 10 دقائق
          $minutes = 0
          while ($minutes -lt 350 -and -not $sshJob.HasExited) {
              Start-Sleep -Seconds 60
              $minutes++
              if ($minutes % 10 -eq 0) {
                  Write-Host "[*] Server Uptime: $minutes / 350 minutes (Active)" -ForegroundColor Gray
              }
          }
