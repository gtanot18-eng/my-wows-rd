name: Windows RDP Simple & Free

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إنشاء مستخدم RDP مخصص
      - name: Create Dedicated RDP User
        shell: powershell
        run: |
          net user rdpuser Password1234! /add
          net localgroup Administrators rdpuser /add
          net localgroup "Remote Desktop Users" rdpuser /add

      # 2. إعدادات الأمان والتوافق مع Windows 7
      - name: Fix RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 3. تشغيل نفق TCP مجاني عبر LocalXpose
      - name: Start TCP Tunnel
        shell: powershell
        run: |
          curl.exe -L -o loclx.exe https://api.localxpose.io/api/v2/downloads/loclx-windows-amd64.exe
          $proc = Start-Process -FilePath .\loclx.exe -ArgumentList "tunnel","tcp","--to","127.0.0.1:3389" -RedirectStandardOutput loclx.log -RedirectStandardError loclx_err.log -PassThru

          $rdpAddress = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path loclx.log) {
                  $content = Get-Content loclx.log -Raw
                  if ($content -match "([a-zA-Z0-9\.\-]+\.loclx\.io:[0-9]+)") {
                      $rdpAddress = $matches[1]
                      break
                  }
              }
          }

          if ($rdpAddress) {
              Write-Host "=================================================="
              Write-Host "Address  : $rdpAddress"
              Write-Host "Username : rdpuser"
              Write-Host "Password : Password1234!"
              Write-Host "=================================================="

              "### RDP Connection Info" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "* Address: $rdpAddress" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "* Username: rdpuser" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "* Password: Password1234!" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
              if (Test-Path loclx.log) { Get-Content loclx.log }
              if (Test-Path loclx_err.log) { Get-Content loclx_err.log }
          }

      # 4. إبقاء الجلسة تعمل
      - name: Keep Alive Loop
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 320) {
              Start-Sleep -Seconds 60
              $i++
          }
