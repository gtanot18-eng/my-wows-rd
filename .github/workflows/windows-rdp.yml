name: Bore Ultra-Stable Unlimited RDP 2026

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تهيئة كلمة المرور وتفعيل صلاحيات RDP
      - name: Configure Built-in RunnerAdmin
        shell: powershell
        run: |
          # تعيين كلمة مرور صريحة للمستخدم الأساسي runneradmin
          $adminUser = "runneradmin"
          $password = "Matrix2026Pass"
          
          net user $adminUser $password
          net localgroup Administrators $adminUser /add
          net localgroup "Remote Desktop Users" $adminUser /add

          # تفعيل RDP وتعطيل NLA والتشفير المقيد لـ Windows 7
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1

          # تسريع الاستجابة ومعدل 60 FPS
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -PropertyType DWORD -Value 15 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. تشغيل نفق Bore TCP
      - name: Launch Bore Direct TCP Engine
        shell: bash
        run: |
          python -u - << 'EOF'
          import subprocess
          import time
          import re
          import os
          import sys
          import urllib.request
          import zipfile

          print("[*] Downloading Bore Tunnel Binary...")
          bore_url = "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip"
          urllib.request.urlretrieve(bore_url, "bore.zip")
          
          with zipfile.ZipFile("bore.zip", 'r') as zip_ref:
              zip_ref.extractall(".")

          print("[*] Launching Bore TCP Relay to bore.pub...")
          proc = subprocess.Popen(
              ["./bore.exe", "local", "3389", "--to", "bore.pub"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          rdp_address = None
          start_time = time.time()

          while time.time() - start_time < 35:
              line = proc.stdout.readline()
              if not line:
                  continue
              clean_line = line.strip()
              print(f"[Bore Engine] {clean_line}")

              match = re.search(r"bore\.pub:([0-9]+)", clean_line)
              if match:
                  port = match.group(1)
                  rdp_address = f"bore.pub:{port}"
                  break

          if rdp_address:
              print("\n" + "=" * 60)
              print("[+] DIRECT RDP SESSION ACTIVE & READY")
              print(f" Direct Address : {rdp_address}")
              print(" Username       : runneradmin")
              print(" Password       : Matrix2026Pass")
              print("=" * 60 + "\n")

              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("### ⚡ Bore Unlimited RDP\n\n")
                      f.write(f"* **Computer:** `{rdp_address}`\n")
                      f.write("* **Username:** `runneradmin` (or `.\\runneradmin`)\n")
                      f.write("* **Password:** `Matrix2026Pass`\n")

              minutes = 0
              while minutes < 340 and proc.poll() is None:
                  time.sleep(60)
                  minutes += 1
          else:
              print("[!] Failed to obtain Bore tunnel port.")
              sys.exit(1)
          EOF
